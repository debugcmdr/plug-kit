<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>格式转换</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, 'Segoe UI', 'PingFang SC', sans-serif; background: #f5f6f8; color: #1d2129; padding: 22px; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #d0d3d9; border-radius: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    .card { background: #fff; border-radius: 14px; padding: 20px 24px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
    h2 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .sub { font-size: 12px; color: #86909c; margin-bottom: 16px; line-height: 1.6; }

    .cats { display: flex; gap: 8px; margin-bottom: 14px; }
    .cat { flex: 1; text-align: center; padding: 14px 0; border: 1px solid #e0e2e6; border-radius: 9px; cursor: pointer; font-size: 14px; transition: all .15s; background: #fff; }
    .cat:hover { border-color: #3370ff; }
    .cat.active { border-color: #3370ff; background: #f0f5ff; color: #3370ff; font-weight: 500; box-shadow: 0 0 0 3px rgba(51,112,255,.08); }

    label { display: block; font-size: 12px; color: #646a73; margin: 12px 0 6px; }
    select { width: 100%; padding: 11px 13px; border: 1px solid #d0d3d9; border-radius: 9px; font-size: 14px; outline: none; background: #fff; transition: border-color .15s, box-shadow .15s; }
    select:focus { border-color: #3370ff; box-shadow: 0 0 0 3px rgba(51,112,255,.12); }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }

    /* 主操作按钮:自适应宽度,居中(不再撑满整行) */
    .btn { background: #3370ff; color: #fff; border: none; border-radius: 8px; padding: 12px 36px; font-size: 14px; cursor: pointer; display: block; width: auto; margin: 18px auto 0; transition: background .15s; }
    .btn:hover:not(:disabled) { background: #4a82ff; }
    .btn:disabled { background: #c0c4cc; cursor: not-allowed; }

    /* 选择文件按钮(中等大小,与分类按钮均衡) */
    .pick-area { display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px dashed #d0d3d9; border-radius: 12px; padding: 18px; cursor: pointer; transition: all .15s; margin-top: 6px; background: #fafbfc; }
    .pick-area:hover { border-color: #3370ff; background: #f0f5ff; }
    .pick-area .icon { font-size: 24px; color: #3370ff; margin-bottom: 6px; }
    .pick-area .text { font-size: 14px; color: #3370ff; font-weight: 500; }
    .pick-area .sub2 { font-size: 11px; color: #a0a4ab; margin-top: 4px; }

    /* 已选文件列表 */
    .file-list { margin-top: 16px; }
    .file-list h3 { font-size: 13px; color: #646a73; font-weight: 600; margin-bottom: 10px; }
    .file-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; border: 1px solid #e8eaef; border-radius: 9px; margin-bottom: 6px; background: #fafbfc; }
    .file-item .fname { font-size: 13px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* 保存路径 */
    .save-row { display: flex; align-items: center; gap: 8px; margin-top: 14px; padding: 10px 12px; background: #fafbfc; border: 1px solid #e8eaef; border-radius: 10px; }
    .save-row .path { flex: 1; font-size: 13px; color: #1d2129; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
    .save-row .sm-btn { background: #fff; border: 1px solid #d0d3d9; border-radius: 7px; padding: 5px 12px; font-size: 12px; color: #3370ff; cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s; }
    .save-row .sm-btn:hover { background: #f0f5ff; border-color: #3370ff; }
    .file-item .fsize { font-size: 11px; color: #a0a4ab; margin-left: 10px; white-space: nowrap; }
    .file-item .fdel { color: #d54941; cursor: pointer; margin-left: 10px; font-size: 16px; line-height: 1; }
    .file-item .fdel:hover { opacity: .7; }

    .status { margin-top: 12px; font-size: 13px; color: #646a73; white-space: pre-wrap; word-break: break-all; line-height: 1.6; }
    .status.err { color: #d54941; }
    .hidden { display: none; }
    .hint { font-size: 11px; color: #a0a4ab; margin-top: 4px; }
    .done { color: #18a058; }

    /* 视频模块左右分栏:左=视频格式转换,右=音频提取(两个独立操作) */
    .split { display: flex; gap: 12px; margin-top: 14px; }
    .split-card { flex: 1; background: #fafbfc; border: 1px solid #e8eaef; border-radius: 10px; padding: 14px; }
    .split-card .btn { margin-top: 14px; }
    /* 重要:.split 定义晚于 .hidden,同优先级下会覆盖其 display:none →
       必须用更高特异性 (.split.hidden) 保证音频/图片分类下分栏真正隐藏。 */
    .split.hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>格式转换</h2>
    <div class="sub">视频 / 音频 / 图片格式互转，视频模块支持格式转换与音频提取，支持多文件批量。</div>

    <div class="cats" id="cats">
      <div class="cat active" data-cat="video">视频</div>
      <div class="cat" data-cat="audio">音频</div>
      <div class="cat" data-cat="image">图片</div>
    </div>

    <!-- 单个选择文件按钮 -->
    <div class="pick-area" id="pickArea">
      <div class="icon">📁</div>
      <div class="text">选择文件</div>
      <div class="sub2">可多选,仅显示当前类别的文件</div>
    </div>

    <!-- 已选文件列表 -->
    <div class="file-list hidden" id="fileList">
      <h3 style="display:flex; align-items:center; justify-content:space-between;">
        <span>已选文件 (<span id="fileCount">0</span>)</span>
        <span id="btnClear" style="font-size:12px; color:#3370ff; cursor:pointer;">清空</span>
      </h3>
      <div id="fileItems"></div>
    </div>

    <!-- 音频/图片分类:输出格式(+质量)选项 -->
    <div class="row" id="optRow">
      <div>
        <label>输出格式</label>
        <select id="format"></select>
      </div>
      <div id="optQuality" class="hidden">
        <label>质量</label>
        <select id="quality">
          <option value="90">90 (推荐)</option>
          <option value="75">75</option>
          <option value="60">60 (小体积)</option>
        </select>
      </div>
    </div>

    <!-- 视频模块左右分栏(仅 video 分类显示):左=视频格式转换,右=音频提取。
         两个操作相互独立,「点哪个执行哪个」;输出音频扩展名即走 CLI 音频转换分发。 -->
    <div class="split hidden" id="convertSplit">
      <div class="split-card">
        <label>格式转换</label>
        <select id="formatVideo"></select>
        <!-- GIF 参数:仅当输出格式选 gif 时显示 -->
        <div id="gifOpts" class="hidden" style="margin-top:8px;">
          <div class="row" style="gap:8px;">
            <div>
              <label style="margin-top:8px;">帧率</label>
              <select id="gifFps">
                <option value="10">10 fps（推荐）</option>
                <option value="5">5 fps（小体积）</option>
                <option value="15">15 fps（流畅）</option>
              </select>
            </div>
            <div>
              <label style="margin-top:8px;">宽度</label>
              <select id="gifWidth">
                <option value="480">480px（推荐）</option>
                <option value="320">320px（小体积）</option>
                <option value="720">720px（高清）</option>
              </select>
            </div>
          </div>
        </div>
        <div class="hint">将视频转为所选格式</div>
        <button class="btn" id="btnConvertVideo">开始转换</button>
      </div>
      <div class="split-card">
        <label>音频提取</label>
        <select id="audioExtract">
          <option value="copy" selected>原音频（无损复制）</option>
          <option value="mp3">mp3（重编码）</option>
          <option value="m4a">m4a（重编码）</option>
          <option value="wav">wav（重编码）</option>
        </select>
        <div class="hint">原样复制音轨：无损且快速；重编码可压缩体积</div>
        <button class="btn" id="btnExtractAudio">开始提取</button>
      </div>
    </div>

    <!-- 保存路径 -->
    <div class="save-row">
      <span style="font-size:12px;color:#646a73;">保存到</span>
      <span class="path" id="savePath">与源文件同目录</span>
      <button class="sm-btn" id="btnChangeDir">更改</button>
      <button class="sm-btn" id="btnOpenDir">打开</button>
    </div>

    <button class="btn" id="btnConvert">开始转换</button>
    <div class="status" id="status">点击「选择文件」添加文件。</div>
  </div>

  <script>
    const MT = window.MT || window.PlugKit;
    const $ = (id) => document.getElementById(id);

    // HTML 转义:文件名/路径来自本地文件系统,仍可能含 < > " & 等特殊字符,
    // 直接拼 innerHTML 会破坏 DOM 结构。
    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }
    // 取路径最后一段(兼容 Windows 反斜杠)
    function basename(p) { return p.replace(/\\/g, '/').split('/').pop() || p; }

    // 输出格式(常用排前面)。codec 可选:mp4/mkv 的 H.265 用 data-codec=hevc 区分,
    // value 始终是真实扩展名(输出路径拼接直接可用)。
    const FORMATS = {
      video: [
        { v: 'mp4', label: 'mp4（H.264）· 最通用' },
        { v: 'mp4', label: 'mp4（H.265）· 小体积', codec: 'hevc' },
        { v: 'mkv', label: 'mkv（Matroska）' },
        { v: 'mkv', label: 'mkv（H.265）', codec: 'hevc' },
        { v: 'mov', label: 'mov（QuickTime）' },
        { v: 'webm', label: 'webm（VP9）' },
        { v: 'avi', label: 'avi（旧兼容）' },
        { v: 'gif', label: 'gif（动图）' },
        { v: 'm4v', label: 'm4v（Apple）' },
        { v: 'ts', label: 'ts（流媒体）' },
        { v: 'mpg', label: 'mpg（MPEG-1）' },
        { v: 'flv', label: 'flv（Flash）' },
        // 提取音频是独立操作(分栏右侧「开始提取」),不混入输出格式。
      ],
      audio: [
        { v: 'mp3', label: 'mp3（最通用）' },
        { v: 'm4a', label: 'm4a（AAC 封装）' },
        { v: 'aac', label: 'aac（裸 AAC 流）' },
        { v: 'wav', label: 'wav（无损 PCM）' },
        { v: 'flac', label: 'flac（无损压缩）' },
        { v: 'ogg', label: 'ogg（Vorbis 开源）' },
        { v: 'opus', label: 'opus（低延迟高效）' },
        { v: 'wma', label: 'wma（Windows 生态）' },
        { v: 'aiff', label: 'aiff（Apple 无损）' },
      ],
      image: [
        { v: 'jpg', label: 'jpg（最通用）' },
        { v: 'png', label: 'png（无损）' },
        { v: 'webp', label: 'webp（现代高效）' },
        { v: 'avif', label: 'avif（现代高效）' },
        { v: 'gif', label: 'gif（动图）' },
        { v: 'heic', label: 'heic（iPhone 高效）' },
        { v: 'bmp', label: 'bmp（无压缩）' },
        { v: 'tiff', label: 'tiff（印刷存档）' },
      ],
    };
    // 每类可选输入扩展名(文件选择对话框过滤)。
    // svg 不在其中——ffmpeg 官方构建无 SVG 解码器,放了必失败。
    const INPUT_EXTS = {
      video: ['mp4', 'mkv', 'mov', 'webm', 'avi', 'm4v', 'ts', 'ogv', '3gp', 'flv', 'wmv', 'mpg', 'mpeg', 'rmvb', 'm2ts', 'mts', 'vob', '3g2'],
      audio: ['mp3', 'm4a', 'wav', 'flac', 'ogg', 'aac', 'wma', 'aiff', 'opus', 'ape', 'amr', 'm4b', 'mka'],
      image: ['jpg', 'jpeg', 'png', 'webp', 'heic', 'heif', 'bmp', 'gif', 'tiff', 'avif', 'ico', 'psd'],
    };
    const CAT_LABEL = { video: '视频', audio: '音频', image: '图片' };
    let currentCat = 'video';
    let selectedFiles = [];  // [{path, name, size}]
    let saveDir = '';        // 空 = 与源文件同目录

    // ---- 保存路径 ----
    async function changeDir() {
      try {
        const r = await MT.dialog.openFolder();
        if (r && r.path) {
          saveDir = r.path;
          $('savePath').textContent = saveDir;
          setStatus(`保存路径已改为: ${saveDir}`);
        }
      } catch (e) {
        setStatus('更改路径失败: ' + e, true);
      }
    }
    async function openDir() {
      if (!saveDir) {
        // 「与源文件同目录」模式下没有统一的保存文件夹,给出提示而不是打开空路径。
        setStatus('当前为「与源文件同目录」模式,请先点击「更改」设置保存目录', true);
        return;
      }
      try {
        await MT.openPath(saveDir);
      } catch (e) {
        setStatus('打开文件夹失败: ' + e, true);
      }
    }
    $('btnChangeDir').onclick = changeDir;
    $('btnOpenDir').onclick = openDir;

    function setStatus(msg, isErr, title) {
      const el = $('status');
      el.textContent = msg;
      el.title = title || '';
      el.className = 'status' + (isErr ? ' err' : '');
    }

    function fmtSize(bytes) {
      if (!bytes) return '';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
      return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    }

    // 追加文件(去重);对话框与拖放共用。文件大小经 MT.fs.stat 异步填充(尽力而为)。
    function addPaths(paths) {
      const known = new Set(selectedFiles.map(f => f.path));
      let added = 0;
      paths.forEach(p => {
        if (known.has(p)) return;
        selectedFiles.push({ path: p, name: basename(p), size: 0 });
        added++;
        if (MT.fs && MT.fs.stat) {
          MT.fs.stat(p).then((s) => {
            const it = selectedFiles.find(x => x.path === p);
            if (it && s && s.size) { it.size = s.size; renderFiles(); }
          }).catch(() => {});
        }
      });
      if (added > 0) renderFiles();
      return added;
    }

    // 选择文件(多选,按类别过滤)
    async function pickFiles() {
      try {
        const r = await MT.dialog.openFile(INPUT_EXTS[currentCat], true);
        const paths = (r && r.paths) || [];
        if (paths.length === 0) return;
        const added = addPaths(paths);
        setStatus(`已添加 ${added} 个${CAT_LABEL[currentCat]}文件。`);
      } catch (e) {
        setStatus('选择文件失败: ' + e, true);
      }
    }

    function renderFiles() {
      const list = $('fileList');
      const items = $('fileItems');
      items.innerHTML = '';
      if (selectedFiles.length > 0) list.classList.remove('hidden');
      else { list.classList.add('hidden'); return; }
      $('fileCount').textContent = selectedFiles.length;
      selectedFiles.forEach((f, i) => {
        const div = document.createElement('div');
        div.className = 'file-item';
        div.innerHTML = `<span class="fname" title="${esc(f.path)}">${i + 1}. ${esc(f.name)}</span><span class="fsize">${fmtSize(f.size)}</span><span class="fdel" title="移除">×</span>`;
        div.querySelector('.fdel').onclick = () => {
          selectedFiles.splice(i, 1);
          renderFiles();
        };
        items.appendChild(div);
      });
    }

    // 编码器可用性(probe 即时返回;null=未探测,不禁用)。
    // 缺失的编码器对应格式 UI 置灰,与 CLI has_encoder+ENCODER_MISSING 防护一致。
    let encoderMap = null;
    const ENCODER_NEED = {
      'webm': ['libvpx-vp9', 'libopus'],
      'mp4|hevc': ['libx265'], 'mkv|hevc': ['libx265'],
      'heic': ['libx265'], 'webp': ['libwebp'],
      'avif': ['libsvtav1', 'libaom-av1'],
      'wma': ['wmav2'], 'amr': ['libopencore_amrnb'], 'aac': ['aac'],
    };
    function formatDisabled(f) {
      if (!encoderMap) return false;
      const key = f.codec ? f.v + '|' + f.codec : f.v;
      const need = ENCODER_NEED[key] || ENCODER_NEED[f.v];
      // 全部所需编码器都缺失才禁用(如 avif 有任一 AV1 编码器即可)
      return need ? need.every(e => encoderMap[e] === false) : false;
    }

    // 当前分类对应的输出格式下拉:video 用分栏左侧(formatVideo),audio/image 用顶部(format)。
    function formatSelect() { return currentCat === 'video' ? $('formatVideo') : $('format'); }

    function renderFormats() {
      const sel = formatSelect();
      sel.innerHTML = '';
      FORMATS[currentCat].forEach(f => {
        const opt = document.createElement('option');
        opt.value = f.v;
        opt.textContent = f.label;
        opt.disabled = formatDisabled(f);
        if (f.codec) opt.dataset.codec = f.codec;
        sel.appendChild(opt);
      });
      updateOptionVisibility();
    }

    // 选项可见性(按分类切换布局):
    // - video:显示左右分栏(视频转换|音频提取),隐藏顶部选项行与底部大按钮;
    // - audio/image:显示顶部选项行 + 底部大按钮,隐藏分栏;
    // - 质量:仅 image 分类且有损且接入质量参数的格式显示(jpg -q:v / webp -quality);
    // - GIF 参数:video 且输出格式选 gif 时显示(fps/宽度可调)。
    function updateOptionVisibility() {
      const isVideo = currentCat === 'video';
      $('convertSplit').classList.toggle('hidden', !isVideo);
      $('optRow').classList.toggle('hidden', isVideo);
      $('btnConvert').classList.toggle('hidden', isVideo);
      const vfmt = isVideo ? $('formatVideo').value : '';
      $('gifOpts').classList.toggle('hidden', !(isVideo && vfmt === 'gif'));
      const fmt = currentCat === 'image' ? $('format').value : '';
      $('optQuality').classList.toggle('hidden', !(currentCat === 'image' && (fmt === 'jpg' || fmt === 'webp')));
    }
    $('format').onchange = updateOptionVisibility;
    $('formatVideo').onchange = updateOptionVisibility;

    document.querySelectorAll('.cat').forEach(el => {
      el.onclick = () => {
        document.querySelectorAll('.cat').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        currentCat = el.dataset.cat;
        renderFormats();
        setStatus(`将转换${CAT_LABEL[currentCat]},点击「选择文件」添加。`);
      };
    });

    // 批量提交核心:提交即清空选择,异步派发任务(每文件一个独立任务,受并发上限=5约束),
    // 按钮全程可用,用户可以立即挑选新的一批再次点击。进度/倒计时在「任务中心」查看。
    // 输出扩展名决定 CLI 意图:视频/音频/图片扩展名走对应转换;.mp3/.m4a/.wav 走
    // 重编码提取;.copy 走原样提取(无损复制)。
    function submitBatch(fmt, opts) {
      if (selectedFiles.length === 0) { setStatus('请先选择文件', true); return; }
      const batch = selectedFiles.slice();
      selectedFiles = [];
      renderFiles();

      const total = batch.length;
      let done = 0, okCount = 0, failCount = 0;
      setStatus(`已提交 ${total} 个${CAT_LABEL[currentCat]}任务,可在「任务中心」查看进度。`);

      batch.forEach((f) => {
        const dot = f.path.lastIndexOf('.');
        const base = dot > 0 ? f.path.slice(0, dot) : f.path;
        // 输出路径:设了保存目录则输出到该目录,否则与源同目录;fmt='copy' 时即 .copy 占位
        const output = saveDir
          ? saveDir + '/' + basename(base) + '.' + fmt
          : base + '.' + fmt;
        const params = {
          input: f.path, output,
          // quality 仅图片转换需要(其余分类不传,避免空占位串干扰 CLI)
          quality: currentCat === 'image' ? (opts.quality || '90') : undefined,
          audio_bitrate: undefined,
          codec: opts.codec || 'h264',
        };
        if (opts.gifFps) params.gif_fps = opts.gifFps;
        if (opts.gifWidth) params.gif_width = opts.gifWidth;
        MT.invoke('convert', params)
          .then(() => {
            okCount++; done++;
            setStatus(`进度 ${done}/${total} · 成功 ${okCount}${failCount ? ' · 失败 ' + failCount : ''}(可在任务中心查看)`);
          })
          .catch((e) => {
            failCount++; done++;
            const full = String((e && e.message) || e);
            // 简要原因显示在状态区;完整错误(含「｜详情」)在任务中心/日志,hover 可见。
            const i = full.indexOf('｜');
            const head = (i > 0 ? full.slice(0, i) : full).trim();
            setStatus(`❌ ${f.name} 失败: ${head.length > 80 ? head.slice(0, 80) + '…' : head}`, true, full);
          });
      });
    }

    // 底部大按钮(audio/image 分类):格式转换
    function convertAll() {
      const opt = $('format').selectedOptions[0];
      submitBatch(opt.value, { codec: opt.dataset.codec || 'h264', quality: $('quality').value });
    }

    // 视频模块左侧:仅视频格式转换(gif 时带 fps/宽度参数)
    function convertVideos() {
      const opt = $('formatVideo').selectedOptions[0];
      submitBatch(opt.value, {
        codec: opt.dataset.codec || 'h264',
        quality: $('quality').value,
        gifFps: opt.value === 'gif' ? $('gifFps').value : undefined,
        gifWidth: opt.value === 'gif' ? $('gifWidth').value : undefined,
      });
    }

    // 视频模块右侧:音频提取。copy=原样无损复制;mp3/m4a/wav=重编码。
    function extractAudios() {
      submitBatch($('audioExtract').value, {});
    }

    // 清空已选文件列表
    $('btnClear').onclick = () => {
      if (selectedFiles.length === 0) return;
      selectedFiles = [];
      renderFiles();
      setStatus('已清空文件列表。');
    };

    $('pickArea').onclick = pickFiles;
    $('btnConvert').onclick = convertAll;
    $('btnConvertVideo').onclick = convertVideos;
    $('btnExtractAudio').onclick = extractAudios;
    renderFormats();

    // 进页面探测依赖与编码器能力(probe 即时执行,不进任务中心):
    // ffmpeg 缺失给前置提示(替代"转换时才炸");编码器缺失置灰对应格式。
    MT.invoke('probe').then((d) => {
      if (!d) return;
      if (d.has_ffmpeg === false) {
        setStatus('未检测到 ffmpeg 依赖,点击转换时会在「任务中心」提示安装。', true);
      } else if (d.encoders) {
        encoderMap = d.encoders;
        renderFormats();
      }
    }).catch(() => {});

    // 拖放添加文件:外壳把系统拖入的文件路径转发给激活插件(plugkit:files-dropped)。
    // 仅接受当前分类扩展名的文件,其余静默忽略。
    if (MT.onFilesDropped) {
      MT.onFilesDropped((paths) => {
        const exts = new Set(INPUT_EXTS[currentCat]);
        const valid = (paths || []).filter(p =>
          exts.has((p.split('.').pop() || '').toLowerCase()));
        if (valid.length === 0) return;
        const added = addPaths(valid);
        if (added > 0) setStatus(`已拖入 ${added} 个${CAT_LABEL[currentCat]}文件。`);
      });
    }
  </script>
</body>
</html>
