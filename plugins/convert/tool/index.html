<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>格式转换</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, 'Segoe UI', 'PingFang SC', sans-serif; background: #f7f8fa; color: #1f2329; padding: 20px; }
    .card { background: #fff; border-radius: 10px; padding: 16px 20px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    h2 { font-size: 16px; margin-bottom: 4px; }
    .sub { font-size: 12px; color: #646a73; margin-bottom: 14px; }

    .cats { display: flex; gap: 8px; margin-bottom: 14px; }
    .cat { flex: 1; text-align: center; padding: 10px 0; border: 1px solid #e0e2e6; border-radius: 8px; cursor: pointer; font-size: 13px; transition: all .15s; }
    .cat:hover { border-color: #3370ff; }
    .cat.active { border-color: #3370ff; background: #f0f5ff; color: #3370ff; font-weight: 500; }

    label { display: block; font-size: 12px; color: #646a73; margin: 12px 0 6px; }
    select { width: 100%; padding: 10px 12px; border: 1px solid #d0d3d9; border-radius: 8px; font-size: 14px; outline: none; }
    select:focus { border-color: #3370ff; }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }

    .btn { background: #3370ff; color: #fff; border: none; border-radius: 8px; padding: 12px 20px; font-size: 14px; cursor: pointer; width: 100%; margin-top: 16px; }
    .btn:disabled { background: #c0c4cc; cursor: not-allowed; }

    /* 单按钮:选择文件 */
    .pick-area { display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px dashed #d0d3d9; border-radius: 10px; padding: 28px 16px; cursor: pointer; transition: all .15s; margin-top: 6px; }
    .pick-area:hover { border-color: #3370ff; background: #f8faff; }
    .pick-area .icon { font-size: 28px; color: #3370ff; margin-bottom: 8px; }
    .pick-area .text { font-size: 14px; color: #3370ff; font-weight: 500; }
    .pick-area .sub2 { font-size: 11px; color: #a0a4ab; margin-top: 4px; }

    /* 已选文件列表 */
    .file-list { margin-top: 14px; }
    .file-list h3 { font-size: 13px; color: #646a73; font-weight: 500; margin-bottom: 8px; }
    .file-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border: 1px solid #e8eaef; border-radius: 8px; margin-bottom: 6px; background: #fafbfc; }
    .file-item .fname { font-size: 13px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-item .fsize { font-size: 11px; color: #a0a4ab; margin-left: 10px; white-space: nowrap; }
    .file-item .fdel { color: #d54941; cursor: pointer; margin-left: 10px; font-size: 16px; line-height: 1; }
    .file-item .fdel:hover { opacity: .7; }

    .status { margin-top: 12px; font-size: 13px; color: #646a73; white-space: pre-wrap; word-break: break-all; }
    .status.err { color: #d54941; }
    .bar { height: 6px; background: #e8eaef; border-radius: 3px; margin-top: 12px; overflow: hidden; }
    .bar > div { height: 100%; background: #3370ff; border-radius: 3px; transition: width .3s; }
    .hidden { display: none; }
    .hint { font-size: 11px; color: #a0a4ab; margin-top: 4px; }
    .done { color: #18a058; }
  </style>
</head>
<body>
  <div class="card">
    <h2>格式转换</h2>
    <div class="sub">视频 / 音频 / 图片格式互转,支持多文件批量。</div>

    <div class="cats" id="cats">
      <div class="cat active" data-cat="video">视频</div>
      <div class="cat" data-cat="audio">音频</div>
      <div class="cat" data-cat="image">图片</div>
    </div>

    <!-- 单个选择文件按钮 -->
    <div class="pick-area" id="pickArea">
      <div class="icon">📁</div>
      <div class="text">选择文件</div>
      <div class="sub2">可多选,仅显示当前类别的文件</div>
    </div>

    <!-- 已选文件列表 -->
    <div class="file-list hidden" id="fileList">
      <h3>已选文件 (<span id="fileCount">0</span>)</h3>
      <div id="fileItems"></div>
    </div>

    <div class="row">
      <div>
        <label>输出格式</label>
        <select id="format"></select>
      </div>
      <div id="optQuality" class="hidden">
        <label>质量</label>
        <select id="quality">
          <option value="90">90 (推荐)</option>
          <option value="75">75</option>
          <option value="60">60 (小体积)</option>
        </select>
      </div>
      <div id="optPreset" class="hidden">
        <label>编码预设</label>
        <select id="preset">
          <option value="fast">快速</option>
          <option value="medium">平衡 (推荐)</option>
          <option value="slow">高质量</option>
        </select>
      </div>
    </div>

    <button class="btn" id="btnConvert">开始转换</button>
    <div class="bar hidden" id="bar"><div id="barFill" style="width:0%"></div></div>
    <div class="status" id="status">点击「选择文件」添加文件。</div>
  </div>

  <script>
    const MT = window.MT || window.PlugKit;
    const $ = (id) => document.getElementById(id);

    // 输出格式(常用排前面)
    const FORMATS = {
      video: [
        { v: 'mp4', label: 'MP4 (H.264) · 最通用' },
        { v: 'mov', label: 'MOV (QuickTime)' },
        { v: 'mkv', label: 'MKV (Matroska)' },
        { v: 'webm', label: 'WebM (VP9)' },
        { v: 'avi', label: 'AVI' },
        { v: 'gif', label: 'GIF (动图)' },
        { v: 'm4v', label: 'M4V' },
        { v: 'ts', label: 'TS' },
        { v: 'mpg', label: 'MPG (MPEG-1)' },
        { v: 'flv', label: 'FLV' },
      ],
      audio: [
        { v: 'mp3', label: 'MP3 · 最通用' },
        { v: 'm4a', label: 'M4A (AAC)' },
        { v: 'wav', label: 'WAV (无损)' },
        { v: 'flac', label: 'FLAC (无损)' },
        { v: 'aac', label: 'AAC' },
        { v: 'ogg', label: 'OGG (Vorbis)' },
        { v: 'opus', label: 'Opus' },
        { v: 'wma', label: 'WMA' },
        { v: 'aiff', label: 'AIFF' },
      ],
      image: [
        { v: 'jpg', label: 'JPG · 最通用' },
        { v: 'png', label: 'PNG (无损)' },
        { v: 'webp', label: 'WebP' },
        { v: 'gif', label: 'GIF' },
        { v: 'heic', label: 'HEIC' },
        { v: 'bmp', label: 'BMP' },
        { v: 'tiff', label: 'TIFF' },
      ],
    };
    // 每类可选输入扩展名(文件选择对话框过滤)
    const INPUT_EXTS = {
      video: ['mp4', 'mkv', 'mov', 'webm', 'avi', 'm4v', 'ts', 'ogv', '3gp', 'flv', 'wmv', 'mpg', 'mpeg', 'rmvb'],
      audio: ['mp3', 'm4a', 'wav', 'flac', 'ogg', 'aac', 'wma', 'aiff', 'opus', 'ape', 'amr'],
      image: ['jpg', 'jpeg', 'png', 'webp', 'heic', 'heif', 'bmp', 'gif', 'tiff', 'svg', 'avif', 'ico'],
    };
    const CAT_LABEL = { video: '视频', audio: '音频', image: '图片' };
    let currentCat = 'video';
    let selectedFiles = [];  // [{path, name, size}]

    function setStatus(msg, isErr) {
      const el = $('status');
      el.textContent = msg;
      el.className = 'status' + (isErr ? ' err' : '');
    }

    function fmtSize(bytes) {
      if (!bytes) return '';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
      return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    }

    // 选择文件(多选,按类别过滤)
    async function pickFiles() {
      try {
        const r = await MT.dialog.openFile(INPUT_EXTS[currentCat], true);
        const paths = (r && r.paths) || [];
        if (paths.length === 0) return;
        // 追加新文件(去重)
        const known = new Set(selectedFiles.map(f => f.path));
        paths.forEach(p => {
          if (!known.has(p)) {
            const parts = p.split('/');
            selectedFiles.push({ path: p, name: parts[parts.length - 1], size: 0 });
          }
        });
        renderFiles();
        setStatus(`已添加 ${paths.length} 个${CAT_LABEL[currentCat]}文件。`);
      } catch (e) {
        setStatus('选择文件失败: ' + e, true);
      }
    }

    function renderFiles() {
      const list = $('fileList');
      const items = $('fileItems');
      items.innerHTML = '';
      if (selectedFiles.length > 0) list.classList.remove('hidden');
      else { list.classList.add('hidden'); return; }
      $('fileCount').textContent = selectedFiles.length;
      selectedFiles.forEach((f, i) => {
        const div = document.createElement('div');
        div.className = 'file-item';
        div.innerHTML = `<span class="fname" title="${f.path}">${i + 1}. ${f.name}</span><span class="fsize">${fmtSize(f.size)}</span><span class="fdel" title="移除">×</span>`;
        div.querySelector('.fdel').onclick = () => {
          selectedFiles.splice(i, 1);
          renderFiles();
        };
        items.appendChild(div);
      });
    }

    function renderFormats() {
      const sel = $('format');
      sel.innerHTML = '';
      FORMATS[currentCat].forEach(f => {
        const opt = document.createElement('option');
        opt.value = f.v;
        opt.textContent = f.label;
        sel.appendChild(opt);
      });
      $('optPreset').classList.toggle('hidden', currentCat !== 'video');
      $('optQuality').classList.toggle('hidden', currentCat !== 'image');
    }

    document.querySelectorAll('.cat').forEach(el => {
      el.onclick = () => {
        document.querySelectorAll('.cat').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        currentCat = el.dataset.cat;
        renderFormats();
        setStatus(`将转换${CAT_LABEL[currentCat]},点击「选择文件」添加。`);
      };
    });

    // 批量转换
    async function convertAll() {
      if (selectedFiles.length === 0) { setStatus('请先选择文件', true); return; }
      const fmt = $('format').value;
      const preset = $('preset').value;
      const quality = $('quality').value;

      const bar = $('bar'), fill = $('barFill');
      bar.classList.remove('hidden');
      const off = MT.onProgress((evt) => {
        const d = evt.data || evt;
        const pct = d.percent != null ? Math.min(100, Math.max(0, d.percent)) : 0;
        fill.style.width = pct + '%';
      });

      $('btnConvert').disabled = true;
      setStatus(`开始转换 ${selectedFiles.length} 个文件...`);
      let okCount = 0, failCount = 0;
      try {
        for (let i = 0; i < selectedFiles.length; i++) {
          const f = selectedFiles[i];
          setStatus(`(${i + 1}/${selectedFiles.length}) 转换 ${f.name} ...`);
          const dot = f.path.lastIndexOf('.');
          const output = dot > 0 ? f.path.slice(0, dot) + '.' + fmt : f.path + '.' + fmt;
          try {
            const r = await MT.invoke('convert', { input: f.path, output, preset, quality, audio_bitrate: undefined });
            okCount++;
          } catch (e) {
            failCount++;
            setStatus(`❌ ${f.name} 失败: ${e}\n继续下一个...`, true);
          }
        }
        setStatus(okCount > 0
          ? `✅ 完成:${okCount} 成功${failCount ? ', ' + failCount + ' 失败' : ''}。已转格式与源文件同目录。`
          : `❌ 全部失败(${failCount} 个)`, failCount > 0 && okCount === 0);
      } finally {
        $('btnConvert').disabled = false;
        off();
        bar.classList.add('hidden');
      }
    }

    $('pickArea').onclick = pickFiles;
    $('btnConvert').onclick = convertAll;
    renderFormats();
  </script>
</body>
</html>
