<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>格式转换</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, 'Segoe UI', 'PingFang SC', sans-serif; background: #f7f8fa; color: #1f2329; padding: 20px; }
    .card { background: #fff; border-radius: 10px; padding: 16px 20px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    h2 { font-size: 16px; margin-bottom: 4px; }
    .sub { font-size: 12px; color: #646a73; margin-bottom: 14px; }

    .cats { display: flex; gap: 8px; margin-bottom: 14px; }
    .cat { flex: 1; text-align: center; padding: 10px 0; border: 1px solid #e0e2e6; border-radius: 8px; cursor: pointer; font-size: 13px; transition: all .15s; }
    .cat:hover { border-color: #3370ff; }
    .cat.active { border-color: #3370ff; background: #f0f5ff; color: #3370ff; font-weight: 500; }

    label { display: block; font-size: 12px; color: #646a73; margin: 12px 0 6px; }
    input, select { width: 100%; padding: 10px 12px; border: 1px solid #d0d3d9; border-radius: 8px; font-size: 14px; outline: none; }
    input:focus, select:focus { border-color: #3370ff; }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }

    .btn { background: #3370ff; color: #fff; border: none; border-radius: 8px; padding: 12px 20px; font-size: 14px; cursor: pointer; width: 100%; margin-top: 16px; }
    .btn:disabled { background: #c0c4cc; cursor: not-allowed; }
    .file-row { display: flex; gap: 10px; }
    .file-row input { flex: 1; background: #fafbfc; cursor: default; }
    .btn-file { background: #3370ff; color: #fff; border: none; border-radius: 8px; padding: 10px 18px; font-size: 14px; cursor: pointer; white-space: nowrap; }
    .btn-file:hover { background: #2860e8; }

    .status { margin-top: 12px; font-size: 13px; color: #646a73; white-space: pre-wrap; word-break: break-all; }
    .status.err { color: #d54941; }
    .bar { height: 6px; background: #e8eaef; border-radius: 3px; margin-top: 12px; overflow: hidden; }
    .bar > div { height: 100%; background: #3370ff; border-radius: 3px; transition: width .3s; }
    .hidden { display: none; }
    .hint { font-size: 11px; color: #a0a4ab; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>格式转换</h2>
    <div class="sub">视频 / 音频 / 图片格式互转,基于 ffmpeg。</div>

    <div class="cats" id="cats">
      <div class="cat active" data-cat="video">视频</div>
      <div class="cat" data-cat="audio">音频</div>
      <div class="cat" data-cat="image">图片</div>
    </div>

    <label>输入文件</label>
    <div class="file-row">
      <input id="input" placeholder="点击选择文件" readonly />
      <button class="btn-file" id="btnPick">选择文件</button>
    </div>
    <div class="hint" id="fileHint">点击「选择文件」,只显示当前类别的文件。</div>

    <div class="row">
      <div>
        <label>输出格式</label>
        <select id="format"></select>
      </div>
      <div id="optQuality" class="hidden">
        <label>质量</label>
        <select id="quality">
          <option value="90">90 (推荐)</option>
          <option value="75">75</option>
          <option value="60">60 (小体积)</option>
        </select>
      </div>
      <div id="optPreset" class="hidden">
        <label>编码预设</label>
        <select id="preset">
          <option value="fast">快速</option>
          <option value="medium">平衡 (推荐)</option>
          <option value="slow">高质量</option>
        </select>
      </div>
    </div>

    <button class="btn" id="btnConvert">开始转换</button>
    <div class="bar hidden" id="bar"><div id="barFill" style="width:0%"></div></div>
    <div class="status" id="status">选择类别和格式,输入文件路径后转换。</div>
  </div>

  <script>
    const MT = window.MT || window.PlugKit;
    const $ = (id) => document.getElementById(id);

    const FORMATS = {
      video: ['mp4', 'mkv', 'mov', 'webm', 'avi', 'gif'],
      audio: ['mp3', 'm4a', 'wav', 'flac', 'ogg'],
      image: ['jpg', 'png', 'webp', 'heic'],
    };
    // 每类可选的输入扩展名(文件选择对话框过滤)
    const INPUT_EXTS = {
      video: ['mp4', 'mkv', 'mov', 'webm', 'avi', 'm4v', 'ts', 'ogv', '3gp', 'flv', 'wmv'],
      audio: ['mp3', 'm4a', 'wav', 'flac', 'ogg', 'aac', 'wma', 'aiff', 'opus'],
      image: ['jpg', 'jpeg', 'png', 'webp', 'heic', 'heif', 'bmp', 'gif', 'tiff'],
    };
    const CAT_LABEL = { video: '视频', audio: '音频', image: '图片' };
    let currentCat = 'video';

    function setStatus(msg, isErr) {
      const el = $('status');
      el.textContent = msg;
      el.className = 'status' + (isErr ? ' err' : '');
    }

    // 选择文件:按当前类别过滤扩展名
    async function pickFile() {
      try {
        const r = await MT.dialog.openFile(INPUT_EXTS[currentCat]);
        if (r && r.path) {
          $('input').value = r.path;
          $('fileHint').textContent = `已选择:${r.path}`;
          setStatus(`已选择${CAT_LABEL[currentCat]}文件,选择输出格式后转换。`);
        }
      } catch (e) {
        setStatus('选择文件失败: ' + e, true);
      }
    }
    $('btnPick').onclick = pickFile;
    $('input').onclick = pickFile;

    function renderFormats() {
      const sel = $('format');
      sel.innerHTML = '';
      FORMATS[currentCat].forEach(f => {
        const opt = document.createElement('option');
        opt.value = f;
        opt.textContent = f.toUpperCase();
        sel.appendChild(opt);
      });
      // 视频显示预设,图片显示质量
      $('optPreset').classList.toggle('hidden', currentCat !== 'video');
      $('optQuality').classList.toggle('hidden', currentCat !== 'image');
    }

    document.querySelectorAll('.cat').forEach(el => {
      el.onclick = () => {
        document.querySelectorAll('.cat').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        currentCat = el.dataset.cat;
        renderFormats();
        setStatus(`将${CAT_LABEL[currentCat]}转换。`);
      };
    });

    async function convert() {
      const input = $('input').value.trim();
      if (!input) { setStatus('请先选择输入文件', true); return; }
      const fmt = $('format').value;
      const dot = input.lastIndexOf('.');
      const output = dot > 0 ? input.slice(0, dot) + '.' + fmt : input + '.' + fmt;

      const preset = $('preset').value;
      const quality = $('quality').value;

      const bar = $('bar'), fill = $('barFill');
      bar.classList.remove('hidden');
      const off = MT.onProgress((evt) => {
        const d = evt.data || evt;
        const pct = d.percent != null ? Math.min(100, Math.max(0, d.percent)) : 0;
        fill.style.width = pct + '%';
        setStatus(`${d.message || '转换中'} ${pct.toFixed(0)}%`);
      });

      $('btnConvert').disabled = true;
      try {
        const r = await MT.invoke('convert', { input, output, preset, quality, audio_bitrate: undefined });
        setStatus(`✅ 转换完成!\n${CAT_LABEL[r.category]}输出: ${r.output}\n大小: ${(r.size / 1024 / 1024).toFixed(2)} MB`);
      } catch (e) {
        setStatus('❌ 转换失败: ' + e, true);
      } finally {
        $('btnConvert').disabled = false;
        off();
      }
    }

    $('btnConvert').onclick = convert;
    renderFormats();
  </script>
</body>
</html>
