<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>视频格式转换</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, 'Segoe UI', 'PingFang SC', sans-serif; background: #f7f8fa; color: #1f2329; padding: 24px; }
    .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    h2 { font-size: 18px; margin-bottom: 16px; }
    label { display: block; font-size: 13px; color: #646a73; margin: 12px 0 6px; }
    input, select { width: 100%; padding: 10px 12px; border: 1px solid #d0d3d9; border-radius: 8px; font-size: 14px; outline: none; }
    input:focus, select:focus { border-color: #3370ff; }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
    .btn { background: #3370ff; color: #fff; border: none; border-radius: 8px; padding: 12px 20px; font-size: 14px; cursor: pointer; width: 100%; margin-top: 16px; }
    .btn:disabled { background: #c0c4cc; cursor: not-allowed; }
    .status { margin-top: 12px; font-size: 13px; color: #646a73; white-space: pre-wrap; word-break: break-all; }
    .bar { height: 6px; background: #e8eaef; border-radius: 3px; margin-top: 12px; overflow: hidden; }
    .bar > div { height: 100%; background: #3370ff; border-radius: 3px; transition: width .3s; }
    .hint { font-size: 12px; color: #a0a4ab; margin-top: 4px; }
    .err { color: #d54941; }
  </style>
</head>
<body>
  <div class="card">
    <h2>视频格式转换</h2>
    <p style="font-size:13px; color:#646a73;">基于 ffmpeg 转换视频/音频格式。输入完整路径,选择输出格式。</p>

    <label>输入文件路径</label>
    <input id="input" placeholder="/Users/name/Videos/input.mp4" />
    <div class="hint">支持 mp4 / mkv / mov / avi / webm 等</div>

    <div class="row">
      <div>
        <label>输出格式</label>
        <select id="format">
          <option value="mp4">MP4 (H.264 + AAC)</option>
          <option value="mkv">MKV</option>
          <option value="mov">MOV</option>
          <option value="webm">WebM (VP9 + Opus)</option>
        </select>
      </div>
      <div>
        <label>编码预设</label>
        <select id="preset">
          <option value="fast">快速 (推荐)</option>
          <option value="medium">平衡</option>
          <option value="slow">高质量</option>
        </select>
      </div>
    </div>

    <button class="btn" id="btnConvert">开始转换</button>
    <div class="bar hidden" id="bar"><div id="barFill" style="width:0%"></div></div>
    <div class="status" id="status">等待操作...</div>
  </div>

  <script>
    const MT = window.MT || window.PlugKit;
    const $ = (id) => document.getElementById(id);

    function setStatus(msg, isErr) {
      const el = $('status');
      el.textContent = msg;
      el.className = 'status' + (isErr ? ' err' : '');
    }

    async function convert() {
      const input = $('input').value.trim();
      if (!input) { setStatus('请输入输入文件路径', true); return; }
      const fmt = $('format').value;
      const preset = $('preset').value;

      // 输出路径:同目录,改扩展名
      const dot = input.lastIndexOf('.');
      const output = dot > 0 ? input.slice(0, dot) + '.' + fmt : input + '.' + fmt;

      const bar = $('bar'), fill = $('barFill');
      bar.classList.remove('hidden');
      const off = MT.onProgress((evt) => {
        const d = evt.data || evt;
        const pct = d.percent != null ? Math.min(100, Math.max(0, d.percent)) : 0;
        fill.style.width = pct + '%';
        setStatus(`${d.message || '转换中'} ${pct.toFixed(0)}%`);
      });

      $('btnConvert').disabled = true;
      try {
        const r = await MT.invoke('convert', { input, output, preset });
        setStatus(`✅ 转换完成!\n输出: ${r.output}\n大小: ${(r.size / 1024 / 1024).toFixed(2)} MB`);
      } catch (e) {
        setStatus('❌ 转换失败: ' + e, true);
      } finally {
        $('btnConvert').disabled = false;
        off();
      }
    }

    $('btnConvert').onclick = convert;
  </script>
</body>
</html>
