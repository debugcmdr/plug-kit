<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>播放列表下载</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, 'Segoe UI', 'PingFang SC', sans-serif; background: #f5f6f8; color: #1d2129; padding: 22px; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #d0d3d9; border-radius: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    .card { background: #fff; border-radius: 14px; padding: 20px 24px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
    h2 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .sub { font-size: 12px; color: #86909c; margin-bottom: 16px; line-height: 1.6; }

    input[type=text] { width: 100%; padding: 11px 13px; border: 1px solid #d0d3d9; border-radius: 9px; font-size: 14px; outline: none; font-family: inherit; transition: border-color .15s, box-shadow .15s; }
    input[type=text]:focus { border-color: #3370ff; box-shadow: 0 0 0 3px rgba(51,112,255,.12); }
    .btn { background: #3370ff; color: #fff; border: none; border-radius: 8px; padding: 10px 20px; font-size: 14px; cursor: pointer; white-space: nowrap; transition: background .15s; }
    .btn:hover:not(:disabled) { background: #4a82ff; }
    .btn:disabled { background: #c0c4cc; cursor: not-allowed; }
    .btn.ghost { background: #fff; color: #3370ff; border: 1px solid #3370ff; }
    .btn.ghost:hover:not(:disabled) { background: #f0f5ff; }
    .btn-row { display: flex; gap: 10px; margin-top: 12px; justify-content: center; }

    .save-row { display: flex; align-items: center; gap: 8px; margin-top: 14px; padding: 10px 12px; background: #fafbfc; border: 1px solid #e8eaef; border-radius: 10px; flex-wrap: wrap; }
    .save-row .path { flex: 1; font-size: 13px; color: #1d2129; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; min-width: 120px; }
    .save-row .sm-btn { background: #fff; border: 1px solid #d0d3d9; border-radius: 7px; padding: 5px 12px; font-size: 12px; color: #3370ff; cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s; }
    .save-row .sm-btn:hover { background: #f0f5ff; border-color: #3370ff; }
    .save-row select { border: 1px solid #d0d3d9; border-radius: 7px; padding: 5px 8px; font-size: 12px; color: #1d2129; background: #fff; outline: none; }
    .cookies-status { font-size: 12px; color: #18a058; }
    .cookies-status.off { color: #a0a4ab; }
    .row-label { font-size: 12px; color: #646a73; white-space: nowrap; }

    .result { margin-top: 14px; }
    /* 多播放列表卡片:每张卡独立成块,间距分隔 */
    .pl-card { margin-bottom: 16px; padding: 16px; background: #fff; border: 1px solid #e8eaef; border-radius: 14px; transition: border-color .15s, box-shadow .15s; }
    .pl-card:hover { border-color: #d4dcf0; box-shadow: 0 2px 8px rgba(31,35,41,.04); }
    .pl-card:last-child { margin-bottom: 0; }
    .pl-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; background: #f0f5ff; border: 1px solid #d6e4ff; border-radius: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .pl-head .title { font-size: 14px; font-weight: 600; color: #1d2129; flex: 1; min-width: 160px; }
    .pl-head .count { font-size: 12px; color: #3370ff; white-space: nowrap; }
    .pl-head .tools { display: flex; gap: 8px; flex-wrap: wrap; }
    .pl-head .mini { background: #fff; border: 1px solid #3370ff; color: #3370ff; border-radius: 7px; padding: 5px 12px; font-size: 12px; cursor: pointer; transition: background .15s; }
    .pl-head .mini:hover { background: #eef4ff; }

    table.entries { width: 100%; border-collapse: collapse; }
    table.entries th, table.entries td { padding: 7px 10px; text-align: left; border-bottom: 1px solid #f0f1f3; font-size: 13px; }
    table.entries th { color: #646a73; font-weight: 500; background: #fafbfc; position: sticky; top: 0; }
    table.entries tr:hover { background: #f8faff; }
    table.entries td.cb { width: 32px; }
    table.entries td.idx { width: 44px; color: #a0a4ab; }
    table.entries td.dur { width: 70px; color: #a0a4ab; white-space: nowrap; }
    table.entries td.up { width: 130px; color: #646a73; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    table.entries td.views { width: 80px; color: #a0a4ab; text-align: right; }
    table.entries td.t { max-width: 320px; }
    table.entries td.t a { color: #1d2129; text-decoration: none; }
    table.entries td.t a:hover { color: #3370ff; }
    .table-wrap { max-height: 420px; overflow: auto; border: 1px solid #e8eaef; border-radius: 10px; }

    /* 下载进度条:视觉条 + 文字(批量任务级,固定在操作按钮区下方,下载时可见) */
    .dl-bar { margin: 10px 0 4px; padding: 8px 10px; background: #f2f3f5; border-radius: 9px; }
    .dl-track { height: 6px; background: #e5e6eb; border-radius: 3px; overflow: hidden; }
    .dl-fill { height: 100%; width: 0%; background: #3370ff; border-radius: 3px; transition: width .3s; }
    .dl-meta { display: flex; align-items: center; gap: 12px; margin-top: 6px; font-size: 13px; }
    .dl-meta .msg { color: #1d2129; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dl-meta .pct { color: #3370ff; font-weight: 500; min-width: 48px; text-align: right; font-variant-numeric: tabular-nums; }
    .dl-bar.done .dl-fill { background: #18a058; }
    .dl-bar.done .dl-meta .msg, .dl-bar.done .dl-meta .pct { color: #18a058; }
    .hint { font-size: 11px; color: #a0a4ab; margin-top: 6px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>播放列表下载</h2>
    <div class="sub">粘贴播放列表或频道主页链接,批量下载全部 / 勾选部分视频,可导出清单。</div>

    <input type="text" id="url" placeholder="https://www.youtube.com/playlist?list=... 或频道主页 URL / https://www.bilibili.com/medialist/..." />
    <div class="btn-row">
      <button class="btn" id="btnExtract">提取列表</button>
      <button class="btn ghost" id="btnClear">清空</button>
    </div>

    <!-- 保存路径 -->
    <div class="save-row">
      <span class="row-label">保存到</span>
      <span class="path" id="savePath">~/Downloads/PlugKit</span>
      <button class="sm-btn" id="btnChangeDir">更改</button>
      <button class="sm-btn" id="btnOpenDir">打开</button>
    </div>

    <!-- Cookies 登录态(播放列表/频道可能包含需要登录的条目) -->
    <div class="save-row">
      <span class="row-label">登录态</span>
      <select id="cookiesBrowser">
        <option value="">不使用</option>
        <option value="chrome">Chrome</option>
        <option value="edge">Edge</option>
        <option value="firefox">Firefox</option>
        <option value="safari">Safari</option>
        <option value="brave">Brave</option>
      </select>
      <button class="sm-btn" id="btnCookiesApply">应用浏览器</button>
      <button class="sm-btn" id="btnCookiesFile">Cookies 文件…</button>
      <button class="sm-btn" id="btnCookiesClear">清除</button>
      <span class="cookies-status off" id="cookiesStatus">未启用</span>
    </div>

    <!-- 提取结果 -->
    <div id="resultSection" class="result hidden"></div>
  </div>

  <script>
    const MT = window.MT || window.PlugKit;
    const $ = (id) => document.getElementById(id);

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }
    // 简要错误:取「｜详情」之前的原因段,超长截断。完整错误在任务中心/日志。
    function brief(msg) {
      const s = String(msg || '');
      const i = s.indexOf('｜');
      const head = (i > 0 ? s.slice(0, i) : s).trim();
      return head.length > 90 ? head.slice(0, 90) + '…' : head;
    }
    function fmtViews(v) {
      if (!v) return '';
      if (v >= 10000) return (v / 10000).toFixed(1) + '万';
      return String(v);
    }

    let saveDir = '';
    let cookiesSetting = '';
    let pls = [];               // 多播放列表卡片 [{info, items:Set, els, busy}]

    // ---- 保存路径 ----
    async function changeDir() {
      try {
        const r = await MT.dialog.openFolder();
        if (r && r.path) { saveDir = r.path; $('savePath').textContent = saveDir; }
      } catch (e) { /* 静默 */ }
    }
    async function openDir() {
      try { await MT.openPath(saveDir || '~/Downloads/PlugKit'); } catch (e) { /* 静默 */ }
    }
    $('btnChangeDir').onclick = changeDir;
    $('btnOpenDir').onclick = openDir;
    $('btnClear').onclick = () => {
      $('url').value = '';
      pls = [];
      const section = $('resultSection');
      section.classList.add('hidden');
      section.innerHTML = '';
    };

    // ---- Cookies ----
    async function loadCookiesSetting() {
      try {
        const v = await MT.config.get('cookies');
        cookiesSetting = (typeof v === 'string' && v) ? v : '';
      } catch (e) { cookiesSetting = ''; }
      renderCookiesStatus();
    }
    async function saveCookiesSetting(v) {
      cookiesSetting = v || '';
      try { await MT.config.set('cookies', cookiesSetting); } catch (e) { /* 静默 */ }
      renderCookiesStatus();
    }
    function renderCookiesStatus() {
      const el = $('cookiesStatus');
      if (!cookiesSetting) {
        el.textContent = '未启用'; el.className = 'cookies-status off';
      } else if (cookiesSetting.startsWith('/') || cookiesSetting.startsWith('\\')) {
        el.textContent = '文件: ' + cookiesSetting.split('/').pop().split('\\').pop();
        el.title = cookiesSetting; el.className = 'cookies-status';
      } else {
        el.textContent = cookiesSetting.charAt(0).toUpperCase() + cookiesSetting.slice(1) + ' Cookies';
        el.className = 'cookies-status';
      }
    }
    $('btnCookiesApply').onclick = () => saveCookiesSetting($('cookiesBrowser').value);
    $('btnCookiesFile').onclick = async () => {
      try {
        const paths = await MT.dialog.openFile(['txt'], false);
        if (paths && paths.length) saveCookiesSetting(paths[0]);
      } catch (e) { /* 静默 */ }
    };
    $('btnCookiesClear').onclick = () => saveCookiesSetting('');
    loadCookiesSetting();

    // ---- 提取 ----
    $('btnExtract').onclick = async () => {
      const url = $('url').value.trim();
      if (!url) return;
      const btn = $('btnExtract');
      btn.disabled = true;
      btn.textContent = '提取中...';
      try {
        const info = await MT.invoke('list', { url, cookies: cookiesSetting });
        // 追加卡片(多列表并行):提取按钮恢复后可继续提取下一个播放列表
        appendCard(info);
      } catch (e) {
        const msg = ((e && e.message) || e || '提取失败');
        alert('提取失败: ' + msg);
        // macOS cookies 权限错误(Safari 沙盒):提供一键直达「完全磁盘访问」面板
        if (String(msg).indexOf('完全磁盘访问') >= 0 && window.MT && MT.system &&
            confirm('需要在系统设置中为 PlugKit 开启「完全磁盘访问权限」才能读取该浏览器 cookies。是否现在打开设置面板?')) {
          MT.system.openPermissionSettings().catch(() => {});
        }
      } finally {
        btn.disabled = false;
        btn.textContent = '提取列表';
      }
    };

    // 渲染一个播放列表卡片(多列表并行:每次提取追加一张卡,互不覆盖;
    // 任务中心仍统括全部任务,此处卡片只负责本列表的下载/导出/进度展示)。
    function appendCard(info) {
      const card = {
        info: info,
        items: new Set((info.entries || []).map(e => e.index)),
        busy: false,
        els: {},
      };
      pls.push(card);

      const section = $('resultSection');
      section.classList.remove('hidden');
      const wrap = document.createElement('div');
      wrap.className = 'pl-card';
      const entries = (info.entries || []).slice(0, 500);  // 超长列表截断展示
      const truncated = (info.entries || []).length > 500;

      // 卡片内用 class/属性选择器(不用 id——多卡片共存会冲突)
      let html = `<div class="pl-head">
        <span class="title">${esc(info.playlist_title)}</span>
        <span class="count">共 ${info.count} 集</span>
        <span class="tools">
          <button class="mini" data-act="all">全选</button>
          <button class="mini" data-act="none">全不选</button>
          <button class="btn" data-act="download">下载勾选</button>
          <select class="mini" data-act="exportMode" title="导出内容:全量信息(逐集提取,慢) / 纯链接(秒级)">
            <option value="full">全量信息</option>
            <option value="links">纯链接</option>
          </select>
          <button class="mini" data-act="export">导出</button>
        </span>
      </div>`;
      // 进度条紧跟操作按钮区(表格之前):批量下载进度在用户目光处可见
      html += `<div class="dl-bar hidden">
        <div class="dl-track"><div class="dl-fill"></div></div>
        <div class="dl-meta"><span class="msg"></span><span class="pct"></span></div>
      </div>`;
      if (truncated) html += `<div class="hint">列表过长,仅显示前 500 条(下载不受影响)。</div>`;

      html += `<div class="table-wrap"><table class="entries">
        <thead><tr><th class="cb"><input type="checkbox" class="cbAll" /></th><th class="idx">#</th><th>标题</th><th class="dur">时长</th><th class="up">上传者</th><th class="views">播放</th></tr></thead>
        <tbody>`;
      entries.forEach(e => {
        const checked = card.items.has(e.index) ? 'checked' : '';
        html += `<tr>
          <td class="cb"><input type="checkbox" class="row-cb" data-idx="${e.index}" ${checked} /></td>
          <td class="idx">${e.index}</td>
          <td class="t"><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a></td>
          <td class="dur">${esc(e.duration_string)}</td>
          <td class="up">${esc(e.uploader)}</td>
          <td class="views">${fmtViews(e.view_count)}</td>
        </tr>`;
      });
      html += '</tbody></table></div>';
      html += `<div class="hint">勾选后点击「下载勾选」批量下载;每集保存为 <code>播放列表名/序号-标题.ext</code>。</div>`;
      wrap.innerHTML = html;
      section.appendChild(wrap);

      // 卡片内元素引用
      card.els = {
        wrap: wrap,
        bar: wrap.querySelector('.dl-bar'),
        fill: wrap.querySelector('.dl-fill'),
        msg: wrap.querySelector('.msg'),
        pct: wrap.querySelector('.pct'),
        cbAll: wrap.querySelector('.cbAll'),
        rowCbs: wrap.querySelectorAll('.row-cb'),
        btnDownload: wrap.querySelector('[data-act="download"]'),
        exportMode: wrap.querySelector('[data-act="exportMode"]'),
      };

      // 卡片内事件绑定(闭包持有 card,互不干扰)
      wrap.querySelector('[data-act="all"]').onclick = () => {
        entries.forEach(en => card.items.add(en.index));
        card.els.rowCbs.forEach(cb => { cb.checked = true; });
        card.els.cbAll.checked = true;
      };
      wrap.querySelector('[data-act="none"]').onclick = () => {
        entries.forEach(en => card.items.delete(en.index));
        card.els.rowCbs.forEach(cb => { cb.checked = false; });
        card.els.cbAll.checked = false;
      };
      card.els.cbAll.onclick = (e) => {
        const on = e.target.checked;
        entries.forEach(en => { if (on) card.items.add(en.index); else card.items.delete(en.index); });
        card.els.rowCbs.forEach(cb => { cb.checked = on; });
      };
      card.els.rowCbs.forEach(cb => {
        cb.onclick = (e) => {
          const idx = Number(e.target.dataset.idx);
          if (e.target.checked) card.items.add(idx); else card.items.delete(idx);
        };
      });
      card.els.btnDownload.onclick = () => doDownload(card);
      wrap.querySelector('[data-act="export"]').onclick = () => doExport(card);

      // 新卡片滚到可见
      wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      return card;
    }

    // 勾选序号 → "1,3,5" / "1-3,5"(连续区间合并)。items 为卡片自己的勾选集合。
    function itemsToRange(items) {
      const idxs = [...items].sort((a, b) => a - b);
      if (idxs.length === 0) return '';
      const parts = [];
      let start = idxs[0], prev = idxs[0];
      for (let i = 1; i <= idxs.length; i++) {
        const cur = idxs[i];
        if (cur === prev + 1) { prev = cur; continue; }
        parts.push(start === prev ? String(start) : `${start}-${prev}`);
        start = cur; prev = cur;
      }
      return parts.join(',');
    }

    // ---- 下载(卡片级:进度显示在本卡片,任务中心仍统括全局任务) ----
    async function doDownload(card) {
      if (!card || card.busy) return;
      const range = itemsToRange(card.items);
      if (!range) { alert('请先勾选要下载的集'); return; }
      card.busy = true;
      const btn = card.els.btnDownload;
      const bar = card.els.bar;
      const msg = card.els.msg;
      const pct = card.els.pct;
      const fill = card.els.fill;
      btn.disabled = true;
      bar.classList.remove('hidden');
      bar.classList.remove('done');
      msg.textContent = '准备批量下载...';
      pct.textContent = '0%';
      fill.style.width = '0%';
      fill.style.background = '';
      // 进度条紧跟操作按钮区,长列表场景仍自动滚到进度条处,保证实时可见。
      bar.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

      // 任务标识:进度事件按 task_id 过滤,多卡片/多插件并发时不串台。
      // 后端 bridge 优先采用插件传入的 task_id(无则自动创建)。
      const taskId = (crypto.randomUUID ? crypto.randomUUID() : 'pl-' + Date.now() + '-' + Math.random().toString(36).slice(2));
      const off = MT.onProgress((evt) => {
        const d = evt.data || evt;
        // 旧版主程序事件不带 task_id → 兼容过滤(无 task_id 视为当前任务)
        if (d.task_id && d.task_id !== taskId) return;
        if (d.message) msg.textContent = d.message;
        if (d.percent != null) {
          const p = Math.min(100, Math.max(0, d.percent));
          pct.textContent = p.toFixed(0) + '%';
          fill.style.width = p.toFixed(0) + '%';
        }
      });

      try {
        const r = await MT.invoke('download', {
          url: card.info.playlist_url || $('url').value.trim(),
          items: range,
          quality: 'best',
          output_dir: saveDir || undefined,
          cookies: cookiesSetting || '',
          task_id: taskId,
        });
        if (r.output_dir) { $('savePath').textContent = r.output_dir; saveDir = r.output_dir; }
        msg.textContent = '下载完成 ✓';
        pct.textContent = '100%';
        fill.style.width = '100%';
        bar.classList.add('done');
      } catch (e) {
        const full = String((e && e.message) || e);
        msg.textContent = '下载失败: ' + brief(full);
        msg.title = full;  // hover 看完整
        msg.style.color = '#d54941';
        fill.style.background = '#d54941';
        // macOS cookies 权限错误:错误全文已在上面展示,附一键直达授权面板
        if (full.indexOf('完全磁盘访问') >= 0 && window.MT && MT.system) {
          const b = document.createElement('button');
          b.className = 'sm-btn';
          b.style.marginLeft = '8px';
          b.textContent = '打开权限设置';
          b.onclick = () => { MT.system.openPermissionSettings().catch(() => {}); };
          msg.appendChild(b);
        }
      } finally {
        off();
        card.busy = false;
        btn.disabled = false;
      }
    }

    // ---- 导出清单(卡片级) ----
    // 导出内容由卡片内 exportMode 决定:full=全量信息 CSV(逐集提取,慢);links=纯链接 TXT(秒级)。
    async function doExport(card) {
      if (!card) return;
      const btn = card.els.wrap.querySelector('[data-act="export"]');
      const mode = card.els.exportMode.value || 'full';
      btn.disabled = true;
      btn.textContent = mode === 'links' ? '导出链接中...' : '全量提取中(可能较慢)...';
      try {
        const r = await MT.invoke('export', {
          url: card.info.playlist_url || $('url').value.trim(),
          output_dir: saveDir || undefined,
          cookies: cookiesSetting || '',
          mode: mode,
        });
        if (r.output_dir) { $('savePath').textContent = r.output_dir; saveDir = r.output_dir; }
        const label = r.format === 'links' ? '链接清单' : '全量信息 CSV';
        alert(`已导出${label} (${r.format.toUpperCase()}):\n${r.file}\n\n共 ${r.count} 条` +
          (r.format === 'csv' ? '\n\n提示:全量信息为逐集提取,耗时较长属正常;缺字段的平台对应列会留空。' : ''));
        try { await MT.openPath(r.output_dir); } catch (e2) { /* 静默 */ }
      } catch (e) {
        alert('导出失败: ' + ((e && e.message) || e));
      } finally {
        btn.disabled = false;
        btn.textContent = '导出清单';
      }
    }
  </script>
</body>
</html>
