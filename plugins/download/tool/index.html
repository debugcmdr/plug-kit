<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>万能下载</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, 'Segoe UI', 'PingFang SC', sans-serif; background: #f7f8fa; color: #1f2329; padding: 20px; }
    .card { background: #fff; border-radius: 10px; padding: 16px 20px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    h2 { font-size: 16px; margin-bottom: 4px; }
    .sub { font-size: 12px; color: #646a73; margin-bottom: 14px; }

    textarea, input { width: 100%; padding: 10px 12px; border: 1px solid #d0d3d9; border-radius: 8px; font-size: 14px; outline: none; font-family: inherit; }
    textarea:focus, input:focus { border-color: #3370ff; }
    textarea { min-height: 70px; resize: vertical; line-height: 1.6; }
    .btn { background: #3370ff; color: #fff; border: none; border-radius: 8px; padding: 10px 18px; font-size: 14px; cursor: pointer; white-space: nowrap; }
    .btn:disabled { background: #c0c4cc; cursor: not-allowed; }
    .url-row { display: flex; gap: 10px; align-items: flex-start; }
    .url-row .btn { margin-top: 0; }
    .url-hint { font-size: 11px; color: #a0a4ab; margin-top: 4px; }

    /* 保存路径 */
    .save-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 10px 12px; background: #fafbfc; border: 1px solid #e8eaef; border-radius: 8px; }
    .save-row .path { flex: 1; font-size: 13px; color: #1f2329; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
    .save-row .sm-btn { background: none; border: 1px solid #d0d3d9; border-radius: 6px; padding: 5px 12px; font-size: 12px; color: #3370ff; cursor: pointer; white-space: nowrap; }
    .save-row .sm-btn:hover { background: #f0f5ff; }

    .status { margin-top: 12px; font-size: 13px; color: #646a73; white-space: pre-wrap; word-break: break-all; }
    .status.err { color: #d54941; }
    .bar { height: 6px; background: #e8eaef; border-radius: 3px; margin-top: 12px; overflow: hidden; }
    .bar > div { height: 100%; background: #3370ff; border-radius: 3px; transition: width .3s; }
    .hidden { display: none; }

    /* 资源列表 */
    .info-box { background: #f0f5ff; border-left: 3px solid #3370ff; padding: 10px 12px; border-radius: 4px; margin-top: 12px; font-size: 13px; }
    .info-box img { max-width: 120px; border-radius: 6px; margin-bottom: 8px; display: block; }
    .res-section { margin-top: 14px; }
    .res-section h3 { font-size: 13px; color: #646a73; font-weight: 500; margin-bottom: 8px; }
    .fmt-table { width: 100%; border-collapse: collapse; }
    .fmt-table th, .fmt-table td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #f0f1f3; font-size: 13px; }
    .fmt-table th { color: #646a73; font-weight: 500; background: #fafbfc; }
    .fmt-table tr:hover { background: #f8faff; }
    .fmt-table .pick { text-align: right; }
    .fmt-table .pick button { background: none; border: none; color: #3370ff; cursor: pointer; font-size: 13px; padding: 4px 8px; border-radius: 4px; }
    .fmt-table .pick button:hover { background: #eef4ff; }
    .res-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
    .res-card { border: 1px solid #e0e2e6; border-radius: 8px; padding: 10px 12px; cursor: pointer; transition: all .15s; }
    .res-card:hover { border-color: #3370ff; background: #f8faff; }
    .res-card .name { font-size: 13px; margin-bottom: 4px; }
    .res-card .desc { font-size: 11px; color: #a0a4ab; }
    .size { color: #a0a4ab; font-size: 12px; }

    /* 每个链接一个卡片 */
    .link-block { border: 1px solid #e8eaef; border-radius: 10px; padding: 12px 14px; margin-top: 12px; }
    .link-block .link-title { font-size: 13px; font-weight: 500; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .link-block .link-title .status-tag { font-size: 11px; color: #a0a4ab; }
  </style>
</head>
<body>
  <div class="card">
    <h2>万能下载</h2>
    <div class="sub">每行一个链接,最多 20 条。提取后选择要下载的内容。</div>

    <!-- 多链接输入 -->
    <textarea id="urls" placeholder="每行粘贴一个链接&#10;https://www.bilibili.com/video/...&#10;https://www.youtube.com/watch?v=..."></textarea>
    <div class="url-hint">支持多行,最多 20 条;每条会单独解析。</div>
    <div style="margin-top: 10px; display: flex; gap: 10px;">
      <button class="btn" id="btnExtract" style="flex: 1;">提取全部</button>
      <button class="btn" id="btnClear" style="background:#fff;color:#3370ff;border:1px solid #3370ff;">清空</button>
    </div>

    <div class="bar hidden" id="bar"><div id="barFill" style="width:0%"></div></div>
    <div class="status" id="status">粘贴链接后点击「提取全部」。</div>

    <!-- 保存路径 -->
    <div class="save-row">
      <span style="font-size:12px;color:#646a73;">保存到</span>
      <span class="path" id="savePath">~/Downloads/PlugKit</span>
      <button class="sm-btn" id="btnChangeDir">更改</button>
      <button class="sm-btn" id="btnOpenDir">打开</button>
    </div>

    <!-- 提取结果:每个链接一个块 -->
    <div id="resultSection" class="hidden"></div>
  </div>

  <script>
    const MT = window.MT || window.PlugKit;
    const $ = (id) => document.getElementById(id);

    let saveDir = '';           // 空 = 默认 ~/Downloads/PlugKit
    let links = [];             // [{url, title, info, error}]
    let downloading = false;

    function setStatus(msg, isErr) {
      const el = $('status');
      el.textContent = msg;
      el.className = 'status' + (isErr ? ' err' : '');
    }

    function fmtSize(size) {
      if (!size) return '';
      return (size / 1024 / 1024).toFixed(1) + ' MB';
    }

    // ---- 保存路径 ----
    async function changeDir() {
      try {
        const r = await MT.dialog.openFolder();
        if (r && r.path) {
          saveDir = r.path;
          $('savePath').textContent = saveDir;
          setStatus(`保存路径已改为: ${saveDir}`);
        }
      } catch (e) {
        setStatus('更改路径失败: ' + e, true);
      }
    }
    async function openDir() {
      try {
        const p = saveDir || '/Users/guest/Downloads/PlugKit';
        await MT.openPath(p);
      } catch (e) {
        setStatus('打开文件夹失败: ' + e, true);
      }
    }
    $('btnChangeDir').onclick = changeDir;
    $('btnOpenDir').onclick = openDir;
    $('btnClear').onclick = () => { $('urls').value = ''; links = []; $('resultSection').classList.add('hidden'); setStatus('已清空'); };

    // ---- 提取全部(多链接)----
    async function extractAll() {
      const raw = $('urls').value.trim();
      if (!raw) { setStatus('请输入链接', true); return; }
      // 按行拆分,过滤空行,去重,限 20
      const urls = [...new Set(raw.split('\n').map(s => s.trim()).filter(Boolean))];
      if (urls.length === 0) { setStatus('未检测到有效链接', true); return; }
      if (urls.length > 20) { setStatus('最多支持 20 条链接,已截断', true); }
      const limited = urls.slice(0, 20);

      $('btnExtract').disabled = true;
      $('resultSection').classList.remove('hidden');
      $('resultSection').innerHTML = '';

      // 每个链接一个块,先显示"解析中"
      links = limited.map((url, i) => ({ url, title: `链接 ${i + 1}`, info: null, error: null, block: null }));
      links.forEach((l, i) => {
        const block = document.createElement('div');
        block.className = 'link-block';
        block.innerHTML = `<div class="link-title"><span>链接 ${i + 1} · <span style="color:#a0a4ab;font-size:12px;">${l.url}</span></span><span class="status-tag">解析中...</span></div>`;
        $('resultSection').appendChild(block);
        l.block = block;
      });

      // 并发提取(有限并发,避免太多请求)
      const CONCURRENCY = 5;
      let idx = 0;
      async function worker() {
        while (idx < links.length) {
          const i = idx++;
          const l = links[i];
          try {
            const info = await MT.invoke('list-formats', { url: l.url });
            l.info = info;
            l.title = info.title || `链接 ${i + 1}`;
            renderLinkBlock(l);
          } catch (e) {
            l.error = String(e);
            const tag = l.block.querySelector('.status-tag');
            tag.textContent = '❌ 失败';
            tag.style.color = '#d54941';
            l.block.querySelector('.link-title span').innerHTML = `链接 ${i + 1} · <span style="color:#d54941;font-size:12px;">解析失败:${l.error}</span>`;
          }
        }
      }
      const workers = Array.from({ length: Math.min(CONCURRENCY, links.length) }, () => worker());
      await Promise.all(workers);

      $('btnExtract').disabled = false;
      const okCount = links.filter(l => l.info).length;
      const failCount = links.length - okCount;
      setStatus(okCount > 0 ? `✅ 提取完成:${okCount} 成功${failCount ? ', ' + failCount + ' 失败' : ''}。选择要下载的内容。` : '❌ 全部提取失败', failCount === links.length);
    }

    // 渲染单个链接的资源
    function renderLinkBlock(l) {
      const block = l.block;
      const tag = block.querySelector('.status-tag');
      tag.textContent = '✅ 可下载';
      tag.style.color = '#18a058';
      block.querySelector('.link-title span').innerHTML = `<b>${l.title}</b> · <span style="color:#a0a4ab;font-size:12px;">${l.url}</span>`;

      let html = '';
      // 视频清晰度
      const formats = (l.info.video_formats || []);
      if (formats.length > 0) {
        html += '<div class="res-section"><h3>视频</h3><table class="fmt-table"><thead><tr><th>清晰度</th><th>格式</th><th>大小</th><th></th></tr></thead><tbody>';
        formats.forEach(f => {
          html += `<tr><td>${f.label}</td><td>${f.ext}</td><td class="size">${fmtSize(f.size)}</td><td class="pick"><button data-action="dl-video" data-idx="${links.indexOf(l)}" data-label="${f.label}">下载</button></td></tr>`;
        });
        html += '</tbody></table></div>';
      } else {
        html += `<div class="res-section"><h3>视频</h3><div class="res-grid"><div class="res-card" data-action="dl-video" data-idx="${links.indexOf(l)}" data-label="best"><div class="name">最佳画质</div></div></div></div>`;
      }
      // 音频 + 图片
      const ai = links.indexOf(l);
      html += `<div class="res-section"><h3>音频 / 图片</h3><div class="res-grid">
        <div class="res-card" data-action="dl-audio" data-idx="${ai}"><div class="name">提取音频 (MP3)</div></div>
        <div class="res-card" data-action="dl-image" data-idx="${ai}"><div class="name">封面图片</div></div>
      </div></div>`;
      // 直播
      if (l.info.is_live) {
        html += `<div class="res-section"><h3>直播</h3><div class="res-grid"><div class="res-card" data-action="dl-live" data-idx="${ai}"><div class="name">录制直播</div></div></div></div>`;
      }
      const content = document.createElement('div');
      content.innerHTML = html;
      block.appendChild(content);

      // 绑定下载
      block.querySelectorAll('[data-action]').forEach(el => {
        el.onclick = () => startDownload(el.dataset.action, Number(el.dataset.idx), el.dataset.label || 'best');
      });
    }

    // 下载单个资源
    async function startDownload(kind, linkIdx, quality) {
      if (downloading) { setStatus('已有下载进行中,请稍候', true); return; }
      const l = links[linkIdx];
      if (!l || !l.info) { setStatus('该链接未解析成功', true); return; }
      downloading = true;

      const category = kind.replace('dl-', '');
      const bar = $('bar'), fill = $('barFill');
      bar.classList.remove('hidden');
      fill.style.width = '0%';
      const off = MT.onProgress((evt) => {
        const d = evt.data || evt;
        const pct = d.percent != null ? Math.min(100, Math.max(0, d.percent)) : 0;
        fill.style.width = pct + '%';
        setStatus(`${d.message || '下载中'} ${pct.toFixed(0)}%${d.speed ? ' ' + d.speed : ''}`);
      });

      setStatus(`正在下载: ${l.title} (${category})`);
      try {
        const r = await MT.invoke('download', {
          url: l.url,
          category,
          quality: quality || 'best',
          output_dir: saveDir || undefined,
          extra: '',
        });
        const files = r.files || [];
        setStatus(`✅ 下载完成!\n${l.title}\n保存到: ${r.output_dir || saveDir || '~/Downloads/PlugKit'}\n文件: ${files.slice(0, 6).join(', ')}${files.length > 6 ? ' ...' : ''}`);
        // 显示实际保存路径
        if (r.output_dir) { $('savePath').textContent = r.output_dir; saveDir = r.output_dir; }
      } catch (e) {
        setStatus('❌ 下载失败: ' + e, true);
      } finally {
        downloading = false;
        off();
      }
    }

    $('btnExtract').onclick = extractAll;
  </script>
</body>
</html>
