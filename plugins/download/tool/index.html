<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>万能下载</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, 'Segoe UI', 'PingFang SC', sans-serif; background: #f7f8fa; color: #1f2329; padding: 20px; }
    .card { background: #fff; border-radius: 10px; padding: 16px 20px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    h2 { font-size: 16px; margin-bottom: 4px; }
    .sub { font-size: 12px; color: #646a73; margin-bottom: 14px; }

    .url-row { display: flex; gap: 10px; }
    .url-row input { flex: 1; padding: 10px 12px; border: 1px solid #d0d3d9; border-radius: 8px; font-size: 14px; outline: none; }
    .url-row input:focus { border-color: #3370ff; }
    .btn { background: #3370ff; color: #fff; border: none; border-radius: 8px; padding: 10px 18px; font-size: 14px; cursor: pointer; white-space: nowrap; }
    .btn:disabled { background: #c0c4cc; cursor: not-allowed; }
    .btn.ghost { background: #fff; color: #3370ff; border: 1px solid #3370ff; }

    .cats { display: flex; gap: 8px; margin-top: 12px; }
    .cat { flex: 1; text-align: center; padding: 10px 0; border: 1px solid #e0e2e6; border-radius: 8px; cursor: pointer; font-size: 13px; transition: all .15s; }
    .cat:hover { border-color: #3370ff; }
    .cat.active { border-color: #3370ff; background: #f0f5ff; color: #3370ff; font-weight: 500; }

    .status { margin-top: 12px; font-size: 13px; color: #646a73; white-space: pre-wrap; word-break: break-all; }
    .status.err { color: #d54941; }
    .bar { height: 6px; background: #e8eaef; border-radius: 3px; margin-top: 12px; overflow: hidden; }
    .bar > div { height: 100%; background: #3370ff; border-radius: 3px; transition: width .3s; }

    .info-box { background: #f0f5ff; border-left: 3px solid #3370ff; padding: 10px 12px; border-radius: 4px; margin-top: 12px; font-size: 13px; }
    .info-box img { max-width: 120px; border-radius: 6px; margin-bottom: 8px; display: block; }

    .fmt-table { width: 100%; margin-top: 10px; border-collapse: collapse; }
    .fmt-table th, .fmt-table td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #f0f1f3; font-size: 13px; }
    .fmt-table th { color: #646a73; font-weight: 500; background: #fafbfc; }
    .fmt-table tr:hover { background: #f8faff; }
    .fmt-table .pick { text-align: right; }
    .fmt-table .pick button { background: none; border: none; color: #3370ff; cursor: pointer; font-size: 13px; padding: 4px 8px; border-radius: 4px; }
    .fmt-table .pick button:hover { background: #eef4ff; }
    .hidden { display: none; }
    .size { color: #a0a4ab; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>万能下载</h2>
    <div class="sub">粘贴链接,提取资源后选择清晰度下载。支持视频 / 音频 / 图片 / 直播。</div>

    <div class="url-row">
      <input id="url" placeholder="粘贴网页链接 (YouTube / Bilibili / 抖音 / 小红书 ...)" />
      <button class="btn" id="btnExtract">提取</button>
    </div>

    <div class="cats" id="cats">
      <div class="cat active" data-cat="video">视频</div>
      <div class="cat" data-cat="audio">音频</div>
      <div class="cat" data-cat="image">图片</div>
      <div class="cat" data-cat="live">直播</div>
    </div>

    <div class="bar hidden" id="bar"><div id="barFill" style="width:0%"></div></div>
    <div class="status" id="status">粘贴链接后点击「提取」。</div>

    <div class="info-box hidden" id="infoBox"></div>
    <div class="hidden" id="fmtSection">
      <table class="fmt-table">
        <thead><tr><th>清晰度</th><th>格式</th><th>大小</th><th></th></tr></thead>
        <tbody id="fmtBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const MT = window.MT || window.PlugKit;
    const $ = (id) => document.getElementById(id);

    let currentUrl = '';
    let currentCategory = 'video';
    let videoFormats = [];
    let audioExt = 'm4a';

    const CAT_LABEL = { video: '视频', audio: '音频', image: '图片', live: '直播' };

    function setStatus(msg, isErr) {
      const el = $('status');
      el.textContent = msg;
      el.className = 'status' + (isErr ? ' err' : '');
    }

    // 分类选择
    document.querySelectorAll('.cat').forEach(el => {
      el.onclick = () => {
        document.querySelectorAll('.cat').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        currentCategory = el.dataset.cat;
        // 切换分类时更新可下载内容提示
        if (currentCategory === 'audio') {
          setStatus(`将提取音频(MP3)。`);
        } else if (currentCategory === 'image') {
          setStatus('将下载封面/最高质量图片。');
        } else if (currentCategory === 'live') {
          setStatus('将录制直播流。');
        } else {
          setStatus('将下载视频(最高质量)。');
        }
      };
    });

    async function extract() {
      const url = $('url').value.trim();
      if (!url) { setStatus('请输入链接', true); return; }
      currentUrl = url;
      $('btnExtract').disabled = true;
      $('fmtSection').classList.add('hidden');
      $('infoBox').classList.add('hidden');
      setStatus('提取资源信息中...');
      try {
        const info = await MT.invoke('list-formats', { url });
        if (!info || info.title === undefined) { setStatus('未提取到资源信息', true); return; }

        videoFormats = info.video_formats || [];
        audioExt = info.audio_ext || 'm4a';

        // 信息框
        const box = $('infoBox');
        box.classList.remove('hidden');
        box.innerHTML = '';
        if (info.thumbnail) {
          box.innerHTML += `<img src="${info.thumbnail}" onerror="this.style.display='none'" />`;
        }
        box.innerHTML += `<b>${info.title || '未知标题'}</b><br/>
          <span style="color:#646a73;">${info.uploader || ''}${info.duration ? ' · ' + Math.round(info.duration) + 's' : ''}${info.is_live ? ' · 直播中' : ''}</span>`;

        // 视频格式表
        if (videoFormats.length > 0) {
          const body = $('fmtBody');
          body.innerHTML = '';
          videoFormats.forEach(f => {
            const tr = document.createElement('tr');
            const size = f.size ? (f.size / 1024 / 1024).toFixed(1) + ' MB' : '';
            tr.innerHTML = `<td>${f.label}</td><td>${f.ext}</td><td class="size">${size}</td><td class="pick"><button data-fmt-id="${f.id}" data-label="${f.label}">下载</button></td>`;
            tr.querySelector('button').onclick = () => startDownload(f.label, f.id);
            body.appendChild(tr);
          });
          $('fmtSection').classList.remove('hidden');
          setStatus('已提取资源,选择清晰度下载,或切换分类。');
        } else {
          // 无格式列表 → 直接用 best 下载
          setStatus(`已提取「${info.title}」,点击下方下载。`);
        }
      } catch (e) {
        setStatus('❌ 提取失败: ' + e, true);
      } finally {
        $('btnExtract').disabled = false;
      }
    }

    async function startDownload(label, formatId) {
      if (!currentUrl) { setStatus('请先提取链接', true); return; }
      const quality = currentCategory === 'video'
        ? (formatId ? (label || 'best') : 'best')
        : 'best';
      const output_dir = undefined; // 默认 ~/Downloads/PlugKit

      // 进度条
      const bar = $('bar'), fill = $('barFill');
      bar.classList.remove('hidden');
      const off = MT.onProgress((evt) => {
        const d = evt.data || evt;
        const pct = d.percent != null ? Math.min(100, Math.max(0, d.percent)) : 0;
        fill.style.width = pct + '%';
        setStatus(`${d.message || '下载中'} ${pct.toFixed(0)}%${d.speed ? ' ' + d.speed : ''}`);
      });

      setStatus(`正在下载${CAT_LABEL[currentCategory]}...`);
      try {
        const r = await MT.invoke('download', {
          url: currentUrl,
          category: currentCategory,
          quality,
          output_dir,
          extra: currentCategory === 'live' ? '' : '',
        });
        const files = r.files || [];
        setStatus(`✅ 下载完成!\n保存位置: ${r.output_dir || '~/Downloads/PlugKit'}\n文件: ${files.slice(0, 8).join(', ')}${files.length > 8 ? ' ...' : ''}`);
      } catch (e) {
        setStatus('❌ 下载失败: ' + e, true);
      } finally {
        $('btnExtract').disabled = false;
        off();
      }
    }

    $('btnExtract').onclick = extract;
    // Enter 键触发提取
    $('url').addEventListener('keydown', (e) => { if (e.key === 'Enter') extract(); });
  </script>
</body>
</html>
