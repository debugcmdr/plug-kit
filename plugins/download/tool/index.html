<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>万能下载</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, 'Segoe UI', 'PingFang SC', sans-serif; background: #f7f8fa; color: #1f2329; padding: 20px; }
    .card { background: #fff; border-radius: 10px; padding: 16px 20px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    h2 { font-size: 16px; margin-bottom: 4px; }
    .sub { font-size: 12px; color: #646a73; margin-bottom: 14px; }

    .url-row { display: flex; gap: 10px; }
    .url-row input { flex: 1; padding: 10px 12px; border: 1px solid #d0d3d9; border-radius: 8px; font-size: 14px; outline: none; }
    .url-row input:focus { border-color: #3370ff; }
    .btn { background: #3370ff; color: #fff; border: none; border-radius: 8px; padding: 10px 18px; font-size: 14px; cursor: pointer; white-space: nowrap; }
    .btn:disabled { background: #c0c4cc; cursor: not-allowed; }

    .status { margin-top: 12px; font-size: 13px; color: #646a73; white-space: pre-wrap; word-break: break-all; }
    .status.err { color: #d54941; }
    .bar { height: 6px; background: #e8eaef; border-radius: 3px; margin-top: 12px; overflow: hidden; }
    .bar > div { height: 100%; background: #3370ff; border-radius: 3px; transition: width .3s; }

    .info-box { background: #f0f5ff; border-left: 3px solid #3370ff; padding: 10px 12px; border-radius: 4px; margin-top: 12px; font-size: 13px; }
    .info-box img { max-width: 120px; border-radius: 6px; margin-bottom: 8px; display: block; }

    /* 资源列表 */
    .res-section { margin-top: 14px; }
    .res-section h3 { font-size: 13px; color: #646a73; font-weight: 500; margin-bottom: 8px; }
    .fmt-table { width: 100%; border-collapse: collapse; }
    .fmt-table th, .fmt-table td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #f0f1f3; font-size: 13px; }
    .fmt-table th { color: #646a73; font-weight: 500; background: #fafbfc; }
    .fmt-table tr:hover { background: #f8faff; }
    .fmt-table .pick { text-align: right; }
    .fmt-table .pick button { background: none; border: none; color: #3370ff; cursor: pointer; font-size: 13px; padding: 4px 8px; border-radius: 4px; }
    .fmt-table .pick button:hover { background: #eef4ff; }
    .res-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
    .res-card { border: 1px solid #e0e2e6; border-radius: 8px; padding: 10px 12px; cursor: pointer; transition: all .15s; }
    .res-card:hover { border-color: #3370ff; background: #f8faff; }
    .res-card .name { font-size: 13px; margin-bottom: 4px; }
    .res-card .desc { font-size: 11px; color: #a0a4ab; }
    .hidden { display: none; }
    .size { color: #a0a4ab; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>万能下载</h2>
    <div class="sub">粘贴链接 → 提取资源 → 选择要下载的内容。</div>

    <div class="url-row">
      <input id="url" placeholder="粘贴网页链接 (YouTube / Bilibili / 抖音 / 小红书 ...)" />
      <button class="btn" id="btnExtract">提取</button>
    </div>

    <div class="bar hidden" id="bar"><div id="barFill" style="width:0%"></div></div>
    <div class="status" id="status">粘贴链接后点击「提取」。</div>

    <div class="info-box hidden" id="infoBox"></div>

    <!-- 提取后的可下载资源(不自动下载) -->
    <div id="resultSection" class="hidden">
      <div class="res-section">
        <h3>视频</h3>
        <table class="fmt-table">
          <thead><tr><th>清晰度</th><th>格式</th><th>大小</th><th></th></tr></thead>
          <tbody id="fmtBody"></tbody>
        </table>
      </div>
      <div class="res-section">
        <h3>音频</h3>
        <div class="res-grid" id="audioGrid"></div>
      </div>
      <div class="res-section">
        <h3>图片 / 封面</h3>
        <div class="res-grid" id="imageGrid"></div>
      </div>
      <div class="res-section hidden" id="liveSection">
        <h3>直播</h3>
        <div class="res-grid" id="liveGrid"></div>
      </div>
    </div>
  </div>

  <script>
    const MT = window.MT || window.PlugKit;
    const $ = (id) => document.getElementById(id);

    let currentUrl = '';
    let currentInfo = null;
    let downloading = false;

    function setStatus(msg, isErr) {
      const el = $('status');
      el.textContent = msg;
      el.className = 'status' + (isErr ? ' err' : '');
    }

    function fmtSize(size) {
      if (!size) return '';
      return (size / 1024 / 1024).toFixed(1) + ' MB';
    }

    async function extract() {
      const url = $('url').value.trim();
      if (!url) { setStatus('请输入链接', true); return; }
      currentUrl = url;
      $('btnExtract').disabled = true;
      $('resultSection').classList.add('hidden');
      $('infoBox').classList.add('hidden');
      setStatus('提取资源信息中...');
      try {
        const info = await MT.invoke('list-formats', { url });
        if (!info || info.title === undefined) { setStatus('未提取到资源信息', true); return; }
        currentInfo = info;

        // 信息框
        const box = $('infoBox');
        box.classList.remove('hidden');
        box.innerHTML = '';
        if (info.thumbnail) {
          box.innerHTML += `<img src="${info.thumbnail}" onerror="this.style.display='none'" />`;
        }
        box.innerHTML += `<b>${info.title || '未知标题'}</b><br/>
          <span style="color:#646a73;">${info.uploader || ''}${info.duration ? ' · ' + Math.round(info.duration) + 's' : ''}${info.is_live ? ' · 直播中' : ''}</span>`;

        // 视频清晰度表格
        const fmtBody = $('fmtBody');
        fmtBody.innerHTML = '';
        const formats = info.video_formats || [];
        if (formats.length > 0) {
          formats.forEach(f => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${f.label}</td><td>${f.ext}</td><td class="size">${fmtSize(f.size)}</td><td class="pick"><button>下载</button></td>`;
            tr.querySelector('button').onclick = () => startDownload('video', f.label, f.id);
            fmtBody.appendChild(tr);
          });
        } else {
          // 无清晰度列表 → 提供"最佳画质"下载
          fmtBody.innerHTML = `<tr><td>最佳画质</td><td>-</td><td class="size"></td><td class="pick"><button>下载</button></td></tr>`;
          fmtBody.querySelector('button').onclick = () => startDownload('video', 'best', null);
        }

        // 音频
        const audioGrid = $('audioGrid');
        audioGrid.innerHTML = '';
        const audioCard = document.createElement('div');
        audioCard.className = 'res-card';
        audioCard.innerHTML = `<div class="name">提取音频 (${(info.audio_ext || 'm4a').toUpperCase()})</div><div class="desc">转为 MP3</div>`;
        audioCard.onclick = () => startDownload('audio', 'best', null);
        audioGrid.appendChild(audioCard);

        // 图片/封面
        const imageGrid = $('imageGrid');
        imageGrid.innerHTML = '';
        const imgCard = document.createElement('div');
        imgCard.className = 'res-card';
        imgCard.innerHTML = `<div class="name">封面图片</div><div class="desc">最高质量封面</div>`;
        imgCard.onclick = () => startDownload('image', 'best', null);
        imageGrid.appendChild(imgCard);

        // 直播(若有)
        $('liveSection').classList.toggle('hidden', !info.is_live);
        if (info.is_live) {
          const liveGrid = $('liveGrid');
          liveGrid.innerHTML = '';
          const liveCard = document.createElement('div');
          liveCard.className = 'res-card';
          liveCard.innerHTML = `<div class="name">录制直播</div><div class="desc">实时录制</div>`;
          liveCard.onclick = () => startDownload('live', 'best', null);
          liveGrid.appendChild(liveCard);
        }

        $('resultSection').classList.remove('hidden');
        setStatus('已提取资源,选择要下载的内容。');
      } catch (e) {
        setStatus('❌ 提取失败: ' + e, true);
      } finally {
        $('btnExtract').disabled = false;
      }
    }

    async function startDownload(category, quality, formatId) {
      if (downloading) { setStatus('已有下载进行中', true); return; }
      downloading = true;
      const label = { video: '视频', audio: '音频', image: '图片', live: '直播' }[category];

      const bar = $('bar'), fill = $('barFill');
      bar.classList.remove('hidden');
      fill.style.width = '0%';
      const off = MT.onProgress((evt) => {
        const d = evt.data || evt;
        const pct = d.percent != null ? Math.min(100, Math.max(0, d.percent)) : 0;
        fill.style.width = pct + '%';
        setStatus(`${d.message || '下载中'} ${pct.toFixed(0)}%${d.speed ? ' ' + d.speed : ''}`);
      });

      setStatus(`正在下载${label}...`);
      try {
        const r = await MT.invoke('download', {
          url: currentUrl,
          category,
          quality: quality || 'best',
          output_dir: undefined,
          extra: '',
        });
        const files = r.files || [];
        setStatus(`✅ 下载完成!\n保存位置: ${r.output_dir || '~/Downloads/PlugKit'}\n文件: ${files.slice(0, 8).join(', ')}${files.length > 8 ? ' ...' : ''}`);
      } catch (e) {
        setStatus('❌ 下载失败: ' + e, true);
      } finally {
        downloading = false;
        off();
      }
    }

    $('btnExtract').onclick = extract;
    // Enter 键触发提取
    $('url').addEventListener('keydown', (e) => { if (e.key === 'Enter') extract(); });
  </script>
</body>
</html>
