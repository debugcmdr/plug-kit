<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>万能下载</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, 'Segoe UI', 'PingFang SC', sans-serif; background: #f7f8fa; color: #1f2329; padding: 20px; }
    .card { background: #fff; border-radius: 10px; padding: 16px 20px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    h2 { font-size: 16px; margin-bottom: 4px; }
    .sub { font-size: 12px; color: #646a73; margin-bottom: 14px; }

    textarea { width: 100%; padding: 10px 12px; border: 1px solid #d0d3d9; border-radius: 8px; font-size: 14px; outline: none; font-family: inherit; min-height: 70px; resize: vertical; line-height: 1.6; }
    textarea:focus { border-color: #3370ff; }
    .btn { background: #3370ff; color: #fff; border: none; border-radius: 8px; padding: 10px 18px; font-size: 14px; cursor: pointer; white-space: nowrap; }
    .btn:disabled { background: #c0c4cc; cursor: not-allowed; }
    .btn-row { display: flex; gap: 10px; margin-top: 10px; }

    /* 保存路径 */
    .save-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 10px 12px; background: #fafbfc; border: 1px solid #e8eaef; border-radius: 8px; }
    .save-row .path { flex: 1; font-size: 13px; color: #1f2329; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
    .save-row .sm-btn { background: none; border: 1px solid #d0d3d9; border-radius: 6px; padding: 5px 12px; font-size: 12px; color: #3370ff; cursor: pointer; white-space: nowrap; }
    .save-row .sm-btn:hover { background: #f0f5ff; }

    /* 资源列表 */
    .res-section { margin-top: 14px; }
    .res-section h3 { font-size: 13px; color: #646a73; font-weight: 500; margin-bottom: 8px; }
    .fmt-table { width: 100%; border-collapse: collapse; }
    .fmt-table th, .fmt-table td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #f0f1f3; font-size: 13px; }
    .fmt-table th { color: #646a73; font-weight: 500; background: #fafbfc; }
    .fmt-table tr:hover { background: #f8faff; }
    .fmt-table .pick { text-align: right; }
    .size { color: #a0a4ab; font-size: 12px; }

    /* 下载按钮 + 进度(按钮左侧百分比 + 完成对钩) */
    .dl-cell { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
    .dl-progress { font-size: 12px; color: #3370ff; font-weight: 500; min-width: 36px; text-align: right; }
    .dl-progress.done { color: #18a058; }
    .dl-check { color: #18a058; font-size: 15px; display: none; }
    .dl-check.show { display: inline; }
    .dl-btn { background: none; border: none; color: #3370ff; cursor: pointer; font-size: 13px; padding: 4px 8px; border-radius: 4px; white-space: nowrap; }
    .dl-btn:hover { background: #eef4ff; }
    .dl-btn:disabled { color: #c0c4cc; cursor: not-allowed; }

    .res-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
    .res-card { border: 1px solid #e0e2e6; border-radius: 8px; padding: 10px 12px; cursor: pointer; transition: all .15s; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .res-card:hover { border-color: #3370ff; background: #f8faff; }
    .res-card .name { font-size: 13px; }
    .res-card .desc { font-size: 11px; color: #a0a4ab; }

    /* 每个链接一个卡片 */
    .link-block { border: 1px solid #e8eaef; border-radius: 10px; padding: 12px 14px; margin-top: 12px; }
    .link-block .link-title { font-size: 13px; font-weight: 500; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .link-block .link-title .status-tag { font-size: 11px; color: #a0a4ab; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>万能下载</h2>
    <div class="sub">每行一个链接,最多 20 条。提取后选择要下载的内容。</div>

    <!-- 多链接输入 -->
    <textarea id="urls" placeholder="每行粘贴一个链接&#10;https://www.bilibili.com/video/...&#10;https://www.youtube.com/watch?v=..."></textarea>
    <div class="btn-row">
      <button class="btn" id="btnExtract" style="flex: 1;">提取全部</button>
      <button class="btn" id="btnClear" style="background:#fff;color:#3370ff;border:1px solid #3370ff;">清空</button>
    </div>

    <!-- 保存路径 -->
    <div class="save-row">
      <span style="font-size:12px;color:#646a73;">保存到</span>
      <span class="path" id="savePath">~/Downloads/PlugKit</span>
      <button class="sm-btn" id="btnChangeDir">更改</button>
      <button class="sm-btn" id="btnOpenDir">打开</button>
    </div>

    <!-- 提取结果:每个链接一个块 -->
    <div id="resultSection" class="hidden"></div>
  </div>

  <script>
    const MT = window.MT || window.PlugKit;
    const $ = (id) => document.getElementById(id);

    // HTML 转义:标题/URL/清晰度标签来自 yt-dlp 返回的外部数据(不可信),
    // 直接拼 innerHTML 可注入 <img onerror=...> 执行脚本。
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    let saveDir = '';           // 空 = 默认 ~/Downloads/PlugKit
    let links = [];             // [{url, title, info, error, block}]

    function fmtSize(size) {
      if (!size) return '';
      return (size / 1024 / 1024).toFixed(1) + ' MB';
    }

    // ---- 保存路径 ----
    async function changeDir() {
      try {
        const r = await MT.dialog.openFolder();
        if (r && r.path) { saveDir = r.path; $('savePath').textContent = saveDir; }
      } catch (e) { /* 静默 */ }
    }
    async function openDir() {
      // saveDir 为空时打开默认下载目录(与 CLI 默认一致,后端已支持 ~ 展开)
      try { await MT.openPath(saveDir || '~/Downloads/PlugKit'); } catch (e) { /* 静默 */ }
    }
    $('btnChangeDir').onclick = changeDir;
    $('btnOpenDir').onclick = openDir;
    $('btnClear').onclick = () => {
      $('urls').value = '';
      links = [];
      parseQueue = [];  // 作废排队中的解析
      $('resultSection').classList.add('hidden');
    };

    // ---- 提取全部(多链接,异步分离)----
    // 设计:点击后立即清空输入框并把链接追加到列表,后台按全局并发池(≤5)异步解析。
    // 按钮全程可用——可随时粘贴新链接再次点击「提取全部」,新批次追加显示,不清空已有结果。
    const MAX_PARSE = 5;
    let parseQueue = [];
    let activeParsing = 0;

    function extractAll() {
      const raw = $('urls').value.trim();
      if (!raw) return;
      $('urls').value = '';  // 提取即清空输入框

      // 去重(已在列表中的链接跳过)+ 总数上限 20
      const existing = new Set(links.map(l => l.url));
      const fresh = [...new Set(raw.split('\n').map(s => s.trim()).filter(Boolean))]
        .filter(u => !existing.has(u))
        .slice(0, Math.max(0, 20 - links.length));
      if (fresh.length === 0) return;

      $('resultSection').classList.remove('hidden');
      const batchStart = links.length;   // 本批起始下标
      fresh.forEach((url, k) => {
        const i = batchStart + k;
        links.push({ url, title: `链接 ${i + 1}`, info: null, error: null, block: null });
        const block = document.createElement('div');
        block.className = 'link-block';
        block.innerHTML = `<div class="link-title"><span>链接 ${i + 1} · <span style="color:#a0a4ab;font-size:12px;">${esc(url)}</span></span><span class="status-tag">解析中...</span></div>`;
        $('resultSection').appendChild(block);
        links[i].block = block;
        parseQueue.push({ index: i });
      });
      pumpParse();
    }

    // 全局并发调度:多批提取共用同一并发池(≤5),互不阻塞。
    function pumpParse() {
      while (activeParsing < MAX_PARSE && parseQueue.length > 0) {
        const job = parseQueue.shift();
        activeParsing++;
        parseLink(job.index).finally(() => { activeParsing--; pumpParse(); });
      }
    }

    // 解析单个链接,完成后渲染该链接的资源区块。
    async function parseLink(i) {
      const l = links[i];
      // 用户可能已点「清空」移除该批 → 迟到结果直接丢弃。
      if (!l || !links.includes(l)) return;
      try {
        const info = await MT.invoke('list-formats', { url: l.url });
        if (!l.block || !links.includes(l)) return;
        l.info = info;
        l.title = info.title || `链接 ${i + 1}`;
        renderLinkBlock(l);
      } catch (e) {
        const tag = l.block.querySelector('.status-tag');
        if (tag) {
          // 后端会对重复提取返回具体原因(如"该链接正在解析中/已解析完成"),
          // 用橙色区分于真实解析失败(红色),避免用户误判。
          const msg = (e && e.message) ? e.message : '解析失败';
          const isDup = msg.indexOf('该链接') === 0;
          tag.textContent = (isDup ? '⚠️ ' : '❌ ') + msg;
          tag.style.color = isDup ? '#e8a838' : '#d54941';
        }
      }
    }

    // 渲染单个链接的资源
    function renderLinkBlock(l) {
      const block = l.block;
      const tag = block.querySelector('.status-tag');
      tag.textContent = '✅ 可下载';
      tag.style.color = '#18a058';
      block.querySelector('.link-title span').innerHTML = `<b>${esc(l.title)}</b> · <span style="color:#a0a4ab;font-size:12px;">${esc(l.url)}</span>`;

      let html = '';
      const formats = (l.info.video_formats || []);
      if (formats.length > 0) {
        html += '<div class="res-section"><h3>视频</h3><table class="fmt-table"><thead><tr><th>清晰度</th><th>格式</th><th>大小</th><th></th></tr></thead><tbody>';
        formats.forEach(f => {
          html += `<tr><td>${esc(f.label)}</td><td>${esc(f.ext)}</td><td class="size">${fmtSize(f.size)}</td><td class="pick"><div class="dl-cell" data-action="dl-video" data-idx="${links.indexOf(l)}" data-label="${esc(f.label)}"><span class="dl-progress" data-prog></span><span class="dl-check">✓</span><button class="dl-btn">下载</button></div></td></tr>`;
        });
        html += '</tbody></table></div>';
      } else {
        const ai = links.indexOf(l);
        html += `<div class="res-section"><h3>视频</h3><div class="res-grid"><div class="res-card" data-action="dl-video" data-idx="${ai}" data-label="best"><span class="name">最佳画质</span><span class="dl-progress" data-prog></span><span class="dl-check">✓</span></div></div></div>`;
      }
      // 音频 + 图片
      const ai = links.indexOf(l);
      html += `<div class="res-section"><h3>音频 / 图片</h3><div class="res-grid">
        <div class="res-card" data-action="dl-audio" data-idx="${ai}"><span class="name">提取音频 (MP3)</span><span class="dl-progress" data-prog></span><span class="dl-check">✓</span></div>
        <div class="res-card" data-action="dl-image" data-idx="${ai}"><span class="name">封面图片</span><span class="dl-progress" data-prog></span><span class="dl-check">✓</span></div>
      </div></div>`;
      if (l.info.is_live) {
        html += `<div class="res-section"><h3>直播</h3><div class="res-grid"><div class="res-card" data-action="dl-live" data-idx="${ai}"><span class="name">录制直播</span><span class="dl-progress" data-prog></span><span class="dl-check">✓</span></div></div></div>`;
      }
      const content = document.createElement('div');
      content.innerHTML = html;
      block.appendChild(content);

      // 绑定下载
      block.querySelectorAll('[data-action]').forEach(el => {
        el.onclick = () => startDownload(el.dataset.action, Number(el.dataset.idx), el.dataset.label || 'best', el);
      });
    }

    // 下载单个资源:进度显示在按钮左侧,完成显示绿色对钩
    async function startDownload(kind, linkIdx, quality, el) {
      const l = links[linkIdx];
      if (!l || !l.info) return;
      const category = kind.replace('dl-', '');
      const prog = el.querySelector('[data-prog]');
      const check = el.querySelector('.dl-check');
      const btn = el.querySelector('.dl-btn') || el;
      if (btn) btn.disabled = true;
      if (prog) prog.textContent = '0%';

      const off = MT.onProgress((evt) => {
        const d = evt.data || evt;
        const pct = d.percent != null ? Math.min(100, Math.max(0, d.percent)) : 0;
        if (prog) { prog.textContent = pct.toFixed(0) + '%'; prog.classList.remove('done'); }
      });

      try {
        const r = await MT.invoke('download', {
          url: l.url, category,
          quality: quality || 'best',
          output_dir: saveDir || undefined,
          extra: '',
        });
        if (r.output_dir) { $('savePath').textContent = r.output_dir; saveDir = r.output_dir; }
        if (prog) { prog.textContent = '100%'; prog.classList.add('done'); }
        if (check) check.classList.add('show');
      } catch (e) {
        if (prog) { prog.textContent = '失败'; prog.style.color = '#d54941'; }
      } finally {
        off();
        if (btn) btn.disabled = false;
      }
    }

    $('btnExtract').onclick = extractAll;
  </script>
</body>
</html>
