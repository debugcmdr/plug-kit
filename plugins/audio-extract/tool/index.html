<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>音频提取 / 图片转换</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, 'Segoe UI', 'PingFang SC', sans-serif; background: #f7f8fa; color: #1f2329; padding: 24px; }
    .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    h2 { font-size: 18px; margin-bottom: 16px; }
    label { display: block; font-size: 13px; color: #646a73; margin: 12px 0 6px; }
    input, select { width: 100%; padding: 10px 12px; border: 1px solid #d0d3d9; border-radius: 8px; font-size: 14px; outline: none; }
    input:focus, select:focus { border-color: #3370ff; }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
    .btn { background: #3370ff; color: #fff; border: none; border-radius: 8px; padding: 12px 20px; font-size: 14px; cursor: pointer; width: 100%; margin-top: 16px; }
    .btn.secondary { background: #fff; color: #3370ff; border: 1px solid #3370ff; margin-top: 0; }
    .btn:disabled { background: #c0c4cc; cursor: not-allowed; }
    .status { margin-top: 12px; font-size: 13px; color: #646a73; white-space: pre-wrap; word-break: break-all; }
    .bar { height: 6px; background: #e8eaef; border-radius: 3px; margin-top: 12px; overflow: hidden; }
    .bar > div { height: 100%; background: #3370ff; border-radius: 3px; transition: width .3s; }
    .hint { font-size: 12px; color: #a0a4ab; margin-top: 4px; }
    .err { color: #d54941; }
  </style>
</head>
<body>
  <div class="card">
    <h2>音频提取</h2>
    <p style="font-size:13px; color:#646a73;">从视频中提取音轨,转为 MP3 / M4A / WAV / FLAC。</p>

    <label>输入视频路径</label>
    <input id="input" placeholder="/Users/name/Videos/video.mp4" />

    <div class="row">
      <div>
        <label>音频格式</label>
        <select id="format">
          <option value="mp3">MP3</option>
          <option value="m4a">M4A (AAC)</option>
          <option value="wav">WAV (无损)</option>
          <option value="flac">FLAC (无损)</option>
        </select>
      </div>
    </div>

    <button class="btn" id="btnExtract">提取音频</button>
    <div class="bar hidden" id="bar"><div id="barFill" style="width:0%"></div></div>
    <div class="status" id="status">等待操作...</div>
  </div>

  <div class="card">
    <h2>图片转换</h2>
    <p style="font-size:13px; color:#646a73;">转换图片格式或压缩。</p>

    <label>输入图片路径</label>
    <input id="imgInput" placeholder="/Users/name/Pictures/photo.png" />

    <div class="row">
      <div>
        <label>输出格式</label>
        <select id="imgFormat">
          <option value="jpg">JPG (压缩)</option>
          <option value="png">PNG (无损)</option>
          <option value="webp">WebP</option>
        </select>
      </div>
      <div>
        <label>质量</label>
        <select id="imgQuality">
          <option value="90">90 (推荐)</option>
          <option value="75">75 (小体积)</option>
          <option value="60">60 (更小)</option>
        </select>
      </div>
    </div>

    <button class="btn secondary" id="btnImg">转换图片</button>
    <div class="status" id="imgStatus">等待操作...</div>
  </div>

  <script>
    const MT = window.MT || window.PlugKit;
    const $ = (id) => document.getElementById(id);

    function setStatus(id, msg, isErr) {
      const el = $(id);
      el.textContent = msg;
      el.className = 'status' + (isErr ? ' err' : '');
    }

    async function extract() {
      const input = $('input').value.trim();
      if (!input) { setStatus('status', '请输入视频路径', true); return; }
      const fmt = $('format').value;
      const dot = input.lastIndexOf('.');
      const output = dot > 0 ? input.slice(0, dot) + '.' + fmt : input + '.' + fmt;

      const bar = $('bar'), fill = $('barFill');
      bar.classList.remove('hidden');
      const off = MT.onProgress((evt) => {
        const d = evt.data || evt;
        const pct = d.percent != null ? Math.min(100, Math.max(0, d.percent)) : 0;
        fill.style.width = pct + '%';
        setStatus('status', `${d.message || '提取中'} ${pct.toFixed(0)}%`);
      });

      $('btnExtract').disabled = true;
      try {
        const r = await MT.invoke('extract-audio', { input, output, format: fmt });
        setStatus('status', `✅ 提取完成!\n输出: ${r.output}\n大小: ${(r.size / 1024).toFixed(1)} KB`);
      } catch (e) {
        setStatus('status', '❌ 提取失败: ' + e, true);
      } finally {
        $('btnExtract').disabled = false;
        off();
      }
    }

    async function convertImage() {
      const input = $('imgInput').value.trim();
      if (!input) { setStatus('imgStatus', '请输入图片路径', true); return; }
      const fmt = $('imgFormat').value;
      const quality = $('imgQuality').value;
      const dot = input.lastIndexOf('.');
      const output = dot > 0 ? input.slice(0, dot) + '.' + fmt : input + '.' + fmt;

      setStatus('imgStatus', '转换中...');
      $('btnImg').disabled = true;
      try {
        const r = await MT.invoke('convert-image', { input, output, quality });
        setStatus('imgStatus', `✅ 转换完成!\n输出: ${r.output}\n大小: ${(r.size / 1024).toFixed(1)} KB`);
      } catch (e) {
        setStatus('imgStatus', '❌ 转换失败: ' + e, true);
      } finally {
        $('btnImg').disabled = false;
      }
    }

    $('btnExtract').onclick = extract;
    $('btnImg').onclick = convertImage;
  </script>
</body>
</html>
