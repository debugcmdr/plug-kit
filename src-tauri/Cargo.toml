[package]
name = "plugkit"
version = "0.1.0"
description = "PlugKit | 工具市场 — Open-source multimedia toolbox with plugin architecture"
authors = []
edition = "2021"

[lib]
name = "plugkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
fs2 = "0.4"
reqwest = { version = "0.11", features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["full"] }
flate2 = "1"
tar = "0.4"
zip = "0.6"
sha2 = "0.10"
walkdir = "2"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.10"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
once_cell = "1"
